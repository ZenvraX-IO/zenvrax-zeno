# Zeno, el asistente. Clona el compose de Xrise, que lleva meses en produccion.
#
# Va en la red `zenvrax-io_zenvrax` porque habla con el cockpit por dentro (cockpit-api:8802) en vez
# de salir a internet y volver: menos latencia y el token no da la vuelta por fuera.
#
# NO tiene base de datos. Es una fachada: lee las dos APIs y no guarda nada suyo. La UNICA excepcion
# es el volumen `zeno-datos`, donde vive el permiso cifrado de Google, y es una excepcion obligada:
# un permiso que no persiste obliga a reautorizar las dos cuentas en cada reinicio. Son credenciales,
# no datos de negocio, asi que no crean la tercera verdad que esta arquitectura evita: los correos se
# leen y se olvidan, no se guardan.

services:
  zeno-api:
    build: ..
    container_name: zeno-api
    restart: unless-stopped
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }
    environment:
      # Por dentro de la red: el cockpit responde en 8802 sin pasar por Caddy.
      ZENO_COCKPIT_URL: http://cockpit-api:8802
      ZENO_XRISE_URL: http://ecomops-api:8803
      ZENO_READ_KEY: ${ZENO_READ_KEY}
      ZENO_ORG: ${ZENO_ORGS:-gutlyn}
      # Quien puede entrar. Vacio = cualquiera con sesion valida del cockpit; en produccion, el
      # correo del operador, porque Zeno tiene UN usuario (decision del 2026-09-27).
      ZENO_USUARIOS: ${ZENO_USUARIOS:-}
      # El chat gasta API. Medido sobre 30 dias reales del ecosistema: Haiku sale a $0,0017 por
      # llamada y Sonnet a $0,0079, asi que el chat va con HAIKU (decision del operador, 27-sep).
      # Con el tope de 60 preguntas al dia, el techo son unos 10 centimos diarios.
      ZENO_CHAT_ACTIVO: ${ZENO_CHAT_ACTIVO:-0}
      ZENO_MODELO: ${ZENO_MODELO:-claude-haiku-4-5}
      ZENO_TOPE_PREGUNTAS: ${ZENO_TOPE_PREGUNTAS:-60}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      # LAS DOS CUENTAS DE GOOGLE. Un cliente OAuth por cuenta: los dos dominios tienen Workspace y
      # son dominios distintos, asi que cada uno puede ser una aplicacion INTERNA en su organizacion,
      # sin verificacion de Google y sin que el permiso caduque cada 7 dias. Si las dos estan en la
      # misma organizacion, basta el par comun de abajo.
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GOOGLE_CLIENT_ID_ZENVRAX: ${GOOGLE_CLIENT_ID_ZENVRAX:-}
      GOOGLE_CLIENT_SECRET_ZENVRAX: ${GOOGLE_CLIENT_SECRET_ZENVRAX:-}
      GOOGLE_CLIENT_ID_GUTLYN: ${GOOGLE_CLIENT_ID_GUTLYN:-}
      GOOGLE_CLIENT_SECRET_GUTLYN: ${GOOGLE_CLIENT_SECRET_GUTLYN:-}
      # Hasta donde llegan los permisos: leer, borrador, agenda, escribir. Cada uno se abre aparte: el
      # operador apruebe el salto, porque `escribir` incluye mandar correo en su nombre.
      ZENO_TRAMO: ${ZENO_TRAMO:-leer}
      # Con que se cifra el permiso en disco. Sin esta clave, Zeno no guarda nada y lo dice.
      ZENO_COFRE_KEY: ${ZENO_COFRE_KEY}
      ZENO_COFRE: /datos/google.cofre
      # AVISOS AL MOVIL (Web Push). La llave privada firma cada aviso y vive solo aqui; la publica
      # la ve el navegador al suscribirse, que es como esta pensado. Sin ellas, la aplicacion enseña
      # "faltan las claves" en vez de un boton que no puede funcionar.
      ZENO_VAPID_PUBLICA: ${ZENO_VAPID_PUBLICA:-}
      ZENO_VAPID_PRIVADA: ${ZENO_VAPID_PRIVADA:-}
      ZENO_VAPID_CONTACTO: ${ZENO_VAPID_CONTACTO:-mailto:hola@zenvrax.com}
      ZENO_AVISOS: /datos/avisos.json
      ZENO_TOPE_AVISOS: ${ZENO_TOPE_AVISOS:-5}
      # La clave propia de Zeno, como hash. Entrar pedia la contraseña del cockpit MAS el codigo de
      # seis cifras, varias veces al dia desde el movil: una puerta que cuesta cruzar se deja de
      # cruzar. La del cockpit sigue funcionando; esta se suma. Vacio = solo la del cockpit.
      ZENO_CLAVE_HASH: ${ZENO_CLAVE_HASH:-}
      # LA SEGUNDA LLAVE, solo para lo que publica. Entrar sigue siendo una clave porque detras se
      # LEE; desde J4, aprobar un post lo publica en nombre del operador, y eso pide cuatro digitos
      # mas. El candado se mueve de sitio en vez de volver a la puerta, que es la friccion que ya se
      # quito por hacer que Zeno no se usara.
      ZENO_PIN_HASH: ${ZENO_PIN_HASH:-}
      ZENO_PIN_GRACIA: ${ZENO_PIN_GRACIA:-600}
      # A quien se le permite llamar al ejecutar. Una url que no empiece por una de estas no se
      # dispara aunque traiga contrato: la url llega por la API de otro sistema, o sea es un dato
      # de fuera, y un dato de fuera no elige a quien llama Zeno.
      ZENO_CASAS: ${ZENO_CASAS:-https://n8n.zenvrax.com/,https://cockpit.zenvrax.com/,https://xrise.zenvrax.com/}
      # Tiene que coincidir CARACTER A CARACTER con el URI de redireccion del cliente en Google.
      ZENO_URL_PUBLICA: ${ZENO_URL_PUBLICA:-https://zeno.zenvrax.com}
    volumes:
      - zeno-datos:/datos
    networks: [zenvrax]
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request;urllib.request.urlopen('http://localhost:8804/api/salud',timeout=5)"]
      interval: 30s
      timeout: 6s
      retries: 3
      start_period: 15s

volumes:
  zeno-datos:

networks:
  zenvrax:
    external: true
    name: zenvrax-io_zenvrax
