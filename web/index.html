<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#101012">
<title>Zeno</title>
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" sizes="32x32" href="/img/favicon.png?v=20260927c">
<link rel="icon" sizes="64x64" href="/img/favicon-64.png?v=20260927c">
<link rel="apple-touch-icon" href="/img/apple-touch-icon.png?v=20260927c">
<style>
  /* EL SISTEMA, y cada regla esta aqui porque su ausencia se noto.
     · UN COLOR, UN SIGNIFICADO. El ambar era a la vez marca, cifra, alerta, boton y filtro activo:
       cinco significados es ninguno. Ahora es marca y accion principal, y nada mas.
     · CUATRO TAMAÑOS de letra. Habia nueve entre 10,5 y 22.
     · La caja se gasta donde hay que decidir. Las listas son lineas. */
  :root{
    --negro:#0e0e10; --carbon:#141418; --alto:#17171b; --linea:#1e1e24; --linea-fuerte:#26262c;
    --texto:#f4f4f6; --gris:#8c8c94; --apagado:#77777f; --tenue:#6c6c74;
    --ambar:#f0a830; --ambar-suave:#3a2c12; --rojo:#e0574a; --rojo-claro:#ff9d8f;
    --verde:#4fbf87; --violeta:#b8a0e8;
    /* La voz de Zeno va en serif y del sistema: se distingue de un vistazo de lo que son datos, y
       no cuesta una peticion mas en una aplicacion que se abre veinte veces al dia. */
    --voz:Georgia,"Times New Roman",serif;
    --t1:26px; --t2:19px; --t3:14.5px; --t4:11px;
    --arriba:env(safe-area-inset-top,0px); --abajo:env(safe-area-inset-bottom,0px);
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{background:var(--negro);color:var(--texto);
       font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
       display:flex;flex-direction:column}
  [hidden]{display:none!important}
  button{font:inherit}

  .barra{display:flex;align-items:flex-start;gap:10px;padding:calc(18px + var(--arriba)) 20px 12px;
         position:sticky;top:var(--arriba);background:var(--negro);z-index:5}
  .barra .t{flex:1;font-size:var(--t1);font-weight:600;letter-spacing:-.5px;line-height:1.15}
  .barra .fecha{font-size:var(--t4);letter-spacing:1.4px;text-transform:uppercase;
                color:var(--apagado);font-weight:500;display:block;margin-bottom:2px}
  .barra .icono{background:none;border:0;padding:8px;margin-top:6px;color:var(--gris);
                cursor:pointer;line-height:0}
  .barra .salir{color:var(--tenue);background:none;border:0;font-size:12px;margin-top:10px}
  /* LA MARCA ES LA MISMA QUE EL ICONO, y por eso es un SVG con la geometria del generador y no un
     dibujo aparte en CSS. Lo que habia era la PRIMERA version, la que el operador rechazo: la
     diagonal en blanco y un punto ambar. Convivia con un icono distinto en la pestaña y en la
     pantalla de inicio, o sea tres marcas para una aplicacion. */
  .marca{width:26px;height:26px;flex:0 0 auto;display:block}
  /* La marca, el nombre y lo que es. Va arriba del todo y por encima del titulo de la pantalla:
     el titulo cambia ("Hoy", "Trabajo") y esto no, asi que es lo que ancla donde estas. */
  .quien{display:flex;align-items:center;gap:7px;margin-bottom:9px}
  .quien .marca{width:20px;height:20px}
  .quien .nombre{font-size:14px;font-weight:700;letter-spacing:-.2px}
  .quien .va{font-size:9.5px;font-weight:700;letter-spacing:1.2px;color:var(--ambar);
             border:1px solid var(--ambar);border-radius:5px;padding:1px 5px 2px;line-height:1}

  /* `overscroll-behavior:contain` apaga el rebote propio del navegador: sin eso, en iOS el gesto
     lo captura Safari y el tiron de recargar no llega nunca a la aplicacion. */
  main{flex:1;overflow-y:auto;padding:2px 20px 92px;overscroll-behavior:contain;position:relative}
  #tiron{position:absolute;left:0;right:0;top:0;display:flex;align-items:center;
         justify-content:center;color:var(--gris);font-size:12.5px;pointer-events:none;
         height:0;overflow:hidden}
  #tiron.listo{color:var(--ambar)}
  #tiron .rueda{width:15px;height:15px;border:2px solid var(--linea);border-top-color:var(--ambar);
                border-radius:50%;margin-right:8px;display:inline-block}
  #tiron.girando .rueda{animation:gira .7s linear infinite}
  @keyframes gira{to{transform:rotate(360deg)}}
  /* TRES pestañas. Eran seis, y en 390px son 65px cada una. Preguntar y buscar se hacen DESDE
     donde estas, asi que el chat es una burbuja y buscar es la lupa de arriba: no son sitios. */
  .pie{display:flex;gap:8px;border-top:1px solid var(--linea);background:var(--negro);
       padding:8px 12px calc(8px + var(--abajo))}
  .pie button{flex:1;background:var(--carbon);border:1px solid var(--linea);border-radius:12px;
              color:var(--gris);padding:0 0;min-height:44px;font-size:13.5px;font-weight:600;
              cursor:pointer;transition:background .12s,color .12s}
  .pie button:active{background:#1e1e24}
  .pie button.on{background:var(--ambar);border-color:var(--ambar);color:#221a08;font-weight:700}
  .flotante{position:fixed;right:18px;bottom:calc(88px + var(--abajo));width:54px;height:54px;
            border-radius:50%;background:var(--ambar);border:0;display:flex;align-items:center;
            justify-content:center;z-index:6;cursor:pointer;color:#221a08}
  /* Las capas del chat y de buscar. Cubren la pantalla en vez de ser pestañas: se abren, se usan y
     se cierran, que es como se usan de verdad. */
  .capa{position:fixed;inset:0;background:var(--negro);z-index:20;display:flex;
        flex-direction:column;padding-top:var(--arriba)}
  .capa .cabecera{display:flex;align-items:center;gap:10px;padding:14px 20px 10px}
  .capa .cabecera .t{flex:1;font-size:var(--t2);font-weight:600}
  .capa .cuerpo{flex:1;overflow-y:auto;padding:0 20px 20px}

  .aviso-fallo{background:#2a1a18;border:1px solid #50302a;color:#ffb3aa;border-radius:10px;
               padding:10px 12px;font-size:13px;margin-bottom:12px}
  .resumen{color:var(--gris);font-size:13px;margin-bottom:14px}
  .resumen b{color:var(--ambar)}
  .tarjeta{background:var(--carbon);border:1px solid var(--linea);border-radius:13px;
           padding:13px 14px;margin-bottom:12px}
  .neg{font-size:11px;letter-spacing:.8px;text-transform:uppercase;color:var(--gris);margin-bottom:7px}
  .neg.gutlyn{color:#b8a0e8}
  .post{font-weight:600;margin-bottom:5px;line-height:1.35}
  .extracto{color:var(--gris);font-size:13px;margin-bottom:11px;white-space:pre-wrap}
  .btns{display:flex;gap:7px;flex-wrap:wrap}
  .b{border:1px solid var(--linea-fuerte);background:#23232a;color:var(--texto);border-radius:10px;
     padding:11px 15px;font-size:13.5px;font-weight:600;display:inline-flex;align-items:center;
     gap:7px;text-decoration:none;cursor:pointer;font-family:inherit;min-height:44px;
     box-sizing:border-box}
  .b.primaria{background:var(--ambar);color:#221a08;border-color:var(--ambar);font-weight:600}
  .b.gasta{background:none;border-color:#50302a;color:var(--rojo-claro)}
  .b.sin{border-style:dashed;color:var(--gris)}
  .marca-accion{font-size:10.5px;letter-spacing:.4px;text-transform:uppercase;padding:2px 6px;
                border-radius:5px}
  .m-mundo{background:#40201c;color:#ffb3aa}
  .m-cuesta{background:var(--ambar-suave);color:#f3c579}
  .vacio{color:var(--gris);text-align:center;padding:40px 10px}
  /* Cargando NO es un estado vacio: con el relleno de .vacio dejaba medio movil en blanco
     mientras llegaba la respuesta, y parecia que no habia nada. */
  .cargando{color:var(--tenue);font-size:12.5px;padding:10px 0}
  .burbujas{display:flex;flex-direction:column;gap:10px}
  .tu,.el{max-width:88%;padding:10px 13px;border-radius:14px;font-size:14px;line-height:1.45;
          white-space:pre-wrap}
  .tu{align-self:flex-end;background:#232329;border-bottom-right-radius:5px}
  .el{align-self:flex-start;background:var(--carbon);border:1px solid var(--linea);
      border-bottom-left-radius:5px}
  .coste{align-self:flex-start;color:#6f6f78;font-size:10.5px;margin:-6px 0 2px}
  .escribir{display:flex;gap:8px;align-items:center;border-top:1px solid var(--linea);
            padding:10px 12px;background:var(--negro)}
  .escribir input{flex:1;background:#0d0d10;border:1px solid var(--linea);border-radius:20px;
                  padding:11px 14px;color:var(--texto);font-size:16px}
  .enviar{width:36px;height:36px;border-radius:50%;background:var(--ambar);color:#221a08;
          border:0;font-size:17px;font-weight:700;flex:0 0 auto}
  /* FILAS y no fichas: con los titulos reales ("Promos de magnet sin publicar") solo cabia una
     ficha por linea, o sea cinco filas de una ficha. Una fila con el numero alineado a la
     izquierda dice lo mismo en la mitad de alto. */
  .fichas{margin-bottom:8px}
  .ficha{display:flex;gap:12px;align-items:baseline;padding:9px 0;
         border-top:1px solid var(--linea);font-size:var(--t3)}
  .ficha:last-child{border-bottom:1px solid var(--linea)}
  /* La ficha de una cola que se puede ABRIR. Se ve que es tocable sin gritarlo: la flecha y el
     fondo al pulsar bastan, y asi las que no se abren no parecen rotas. */
  .ficha.abrible{width:100%;background:none;border-left:0;border-right:0;border-top:1px solid var(--linea);
                 color:inherit;text-align:left;font:inherit;cursor:pointer}
  .ficha.abrible:active{background:#1a1a1f}
  .ficha .flecha{margin-left:auto;color:var(--apagado);font-size:18px}
  /* El texto que hay que pegar, a la vista y distinto del resto: se lee antes de copiarlo, y si
     el portapapeles falla sigue estando ahi para seleccionarlo a mano. */
  .para-pegar{background:#0d0d10;border:1px solid var(--linea);border-left:3px solid var(--ambar);
              border-radius:10px;padding:11px 12px;margin:8px 0 2px;font-size:14px;
              line-height:1.5;white-space:pre-wrap}
  .ficha b{min-width:30px;text-align:right;font-variant-numeric:tabular-nums;font-size:16px}

  /* La caja de buscar, pensada para el pulgar y no para el raton:
     · font-size 16px OBLIGATORIO. Con menos, iOS hace ZOOM al enfocar y descoloca la pantalla
       entera. Estaba a 14px y era el fallo mas visible en el movil.
     · pegada arriba: al bajar por los resultados se perdia y habia que subir del todo para
       cambiar la busqueda.
     · con boton de borrar: en un teclado tactil, vaciar un campo a base de retroceso es un castigo. */
  .cajabuscar{position:sticky;top:0;z-index:4;background:var(--negro);
              padding:2px 0 12px;display:flex;gap:8px;align-items:center}
  .buscador{flex:1;background:var(--carbon);border:1px solid var(--linea);border-radius:12px;
            padding:13px 14px;color:var(--texto);font-size:16px;-webkit-appearance:none}
  .buscador:focus{outline:none;border-color:var(--ambar)}
  .limpiar{background:none;border:0;color:var(--gris);font-size:20px;width:40px;height:40px;
           flex:0 0 auto}

  /* DICTADO. El operador pidio poder hablar en vez de escribir, en buscar y en preguntar: en el
     movil, con una mano, escribir una pregunta larga es lo que hace que no se pregunte.
     · 44px: es un boton de dedo, no de raton. Mas pequeño se falla y se acaba escribiendo igual.
     · Mientras escucha se pone AMBAR y late. Un microfono abierto sin señal visible es la clase
       de cosa que se queda encendida sin que nadie lo sepa.
     · La animacion se apaga con prefers-reduced-motion, pero el color se queda: la señal no es
       decorativa. */
  .micro{width:44px;height:44px;border-radius:50%;background:var(--carbon);
         border:1px solid var(--linea);color:var(--gris);font-size:17px;flex:0 0 auto;
         display:flex;align-items:center;justify-content:center}
  .micro[hidden]{display:none}
  .micro.oyendo{background:var(--ambar);border-color:var(--ambar);color:#221a08;
                animation:late 1.3s ease-in-out infinite}
  @keyframes late{0%,100%{box-shadow:0 0 0 0 rgba(240,168,48,.55)}
                  50%{box-shadow:0 0 0 7px rgba(240,168,48,0)}}
  @media (prefers-reduced-motion: reduce){ .micro.oyendo{animation:none} }
  /* Lo que se va oyendo, en gris y en cursiva, para que no se confunda con lo ya escrito. */
  .oyendo-texto{font-size:12.5px;color:var(--gris);font-style:italic;padding:0 13px 8px;
                min-height:0}
  /* Cada resultado es una zona TOCABLE de 44px minimo, no una linea de texto. */
  .doc{display:block;text-decoration:none;color:inherit;background:var(--carbon);
       border:1px solid var(--linea);border-left:3px solid var(--ambar);border-radius:11px;
       padding:12px 13px;margin-bottom:10px;min-height:44px}
  .doc:active{background:#1e1e24}
  .doc .t{font-weight:600;font-size:15px;line-height:1.3;margin-bottom:5px}
  .doc .s{color:var(--gris);font-size:13.5px;line-height:1.45}
  .doc .p{display:inline-block;font-size:11px;color:var(--ambar);background:var(--ambar-suave);
          border-radius:5px;padding:1px 6px;margin-bottom:6px}
  .sugerencias{display:flex;flex-wrap:wrap;gap:8px;margin-top:6px}
  .sug{background:var(--carbon);border:1px solid var(--linea);border-radius:18px;
       padding:9px 14px;font-size:13.5px;color:var(--texto)}
  .degradado{color:#f3c579;font-size:12.5px;margin-bottom:10px}

  /* PERSONAL. Cada correo y cada cita es un enlace que abre en Gmail o en Calendar: Zeno ENSEÑA, y
     el trabajo se sigue haciendo donde ya se hace. Por eso son bloques tocables, no filas de tabla. */
  .cuenta{background:var(--carbon);border:1px solid var(--linea);border-radius:11px;
          padding:11px 12px;margin-bottom:9px;display:flex;gap:10px;align-items:center}
  .cuenta .c{flex:1;min-width:0}
  .cuenta .c b{display:block;font-size:13.5px;font-weight:600;overflow:hidden;
                text-overflow:ellipsis;white-space:nowrap}
  .cuenta .c span{color:var(--gris);font-size:11.5px}
  .punto{width:8px;height:8px;border-radius:50%;flex:0 0 auto;background:#4a4a54}
  .punto.si{background:#4fbf87}
  /* El alias no tiene estado propio: no esta ni conectado ni por conectar, se lee con su buzon. */
  .punto.alias{background:none;border:1px solid var(--linea)}
  .apartado{font-size:var(--t4);letter-spacing:1.2px;text-transform:uppercase;color:var(--apagado);
            font-weight:500;margin:24px 0 12px;display:flex;align-items:baseline;gap:8px}
  /* La cuenta conectada es un pie discreto: importa el primer dia y despues estorba. */
  .pie-cuentas{margin:26px 0 4px;color:#6f6f78;font-size:11.5px;text-align:center}
  .avisos{background:var(--carbon);border:1px solid var(--linea);border-radius:12px;
          padding:12px 13px;margin:18px 0 4px;display:flex;gap:11px;align-items:center}
  .avisos .c{flex:1;min-width:0}
  .avisos .c b{display:block;font-size:13.5px;font-weight:600}
  .avisos .c span{color:var(--gris);font-size:11.5px;line-height:1.35;display:block}
  .quitar-cuenta{background:none;border:0;color:#6f6f78;font-size:11.5px;text-decoration:underline;
                 padding:6px;cursor:pointer}
  /* El filtro por negocio: el operador pregunto "cuales vienen de GutLyn y cuales de la
     consultoria". La etiqueta de cada correo ya lo decia, pero obligaba a leerlos uno a uno. */
  .filtros{display:flex;gap:7px;flex-wrap:wrap;margin:0 0 12px}
  .filtro{background:var(--carbon);border:1px solid var(--linea);border-radius:16px;
          padding:7px 13px;font-size:12.5px;color:var(--gris);cursor:pointer;min-height:34px}
  .filtro.on{border-color:var(--ambar);color:var(--ambar);background:var(--ambar-suave)}
  .filtro b{color:inherit;font-weight:600}
  .correo{display:block;text-decoration:none;color:inherit;padding:12px 0;
          border-top:1px solid var(--linea);min-height:44px}
  .correo:last-of-type{border-bottom:1px solid var(--linea)}
  .correo:active{background:#141418}
  .correo .de{display:flex;gap:8px;align-items:baseline;margin-bottom:4px}
  .correo .de b{font-size:13px;font-weight:600;overflow:hidden;text-overflow:ellipsis;
                white-space:nowrap;flex:1;min-width:0}
  .correo .de i{font-style:normal;font-size:10.5px;letter-spacing:.4px;text-transform:uppercase;
                color:var(--gris);flex:0 0 auto}
  .correo .as{font-size:14.5px;line-height:1.35;margin-bottom:4px}
  .correo .re{color:var(--gris);font-size:12.5px;line-height:1.4;
              display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .cita{display:flex;gap:14px;text-decoration:none;color:inherit;padding:11px 0;
        border-top:1px solid var(--linea);min-height:44px}
  .cita:last-of-type{border-bottom:1px solid var(--linea)}
  .cita .h{font-size:13.5px;font-weight:600;color:var(--apagado);flex:0 0 52px;text-align:right;
           font-variant-numeric:tabular-nums}
  .cita .d{flex:1;min-width:0}
  .cita .d b{display:block;font-size:14.5px;font-weight:600;line-height:1.3}
  .cita .d span{color:var(--gris);font-size:11.5px}
  .acciones-cita{display:flex;gap:14px;margin-top:7px}
  .acciones-cita button{background:none;border:0;color:var(--gris);font-size:12px;padding:4px 0;
                        text-decoration:underline;cursor:pointer}
  /* PROPONER UNA CITA. Dos tiempos a proposito: primero se ve lo que se va a crear, y solo despues
     se crea. Por eso la caja de confirmar es visualmente distinta del formulario. */
  .nueva{background:var(--carbon);border:1px solid var(--linea);border-radius:12px;
         padding:12px;margin-bottom:12px}
  .nueva input{width:100%;background:#0d0d10;border:1px solid var(--linea);border-radius:9px;
               padding:11px;color:var(--texto);font-size:16px;margin-bottom:8px}
  .nueva .fila{display:flex;gap:8px}
  .nueva .fila input{flex:1}
  .propuesta{background:var(--ambar-suave);border:1px solid var(--ambar);border-radius:12px;
             padding:13px;margin-bottom:12px}
  .propuesta .q{font-size:15px;font-weight:600;margin-bottom:4px}
  .propuesta .c{color:#f3c579;font-size:13px;margin-bottom:4px}
  .propuesta .ojo{color:#ffb3aa;font-size:12.5px;margin-bottom:10px}
  .choque{background:#2a1a18;border:1px solid #50302a;border-radius:10px;padding:10px 12px;
          margin-bottom:9px;font-size:13px;color:#ffb3aa;display:block;text-decoration:none}

  /* LOS DOS NEGOCIOS A LA PAR. Una tarjeta por negocio, con la misma rejilla de cifras en las dos
     para que se puedan comparar de un vistazo. Las cifras usan tabular-nums porque si no, en una
     columna de numeros, el ancho de cada digito descoloca la lectura. */
  /* HOY. Lo primero que se ve al abrir. Corto a proposito: el foco, lo urgente, y tres lineas.
     Las cifras viven en Negocios y el correo en Personal; repetirlos aqui convertiria la entrada en
     un panel que se deja de leer. */
  .foco{display:block;text-decoration:none;color:inherit;background:var(--alto);
        border:1px solid var(--linea-fuerte);border-radius:16px;padding:18px;margin-bottom:24px}
  .foco .q{font-size:var(--t4);letter-spacing:1.2px;text-transform:uppercase;color:var(--apagado);
           font-weight:500;margin-bottom:12px}
  .foco .t{font-size:var(--t2);font-weight:600;line-height:1.25;letter-spacing:-.3px}
  .foco .c{color:var(--gris);font-size:13.5px;line-height:1.45;margin-top:6px}
  /* Lo urgente es una LISTA, no cuatro cajas rojas: cuatro cajas iguales no son cuatro cosas
     distintas, y el rojo repetido deja de leerse como rojo. */
  .urgente{display:flex;gap:12px;align-items:center;text-decoration:none;color:inherit;
           padding:10px 0;border-top:1px solid var(--linea);min-height:44px;background:none;
           border-left:0;border-right:0;border-bottom:0;border-radius:0;margin:0}
  .urgente:last-of-type{border-bottom:1px solid var(--linea)}
  .urgente .p{width:3px;height:16px;border-radius:2px;background:var(--rojo);flex:0 0 auto}
  .urgente .n{flex:1;font-size:var(--t3);line-height:1.35}
  .atajos{display:flex;gap:12px;margin-top:22px}
  .atajo{flex:1;text-decoration:none;color:inherit;background:var(--carbon);border-radius:14px;
         padding:14px}
  .atajo b{display:block;font-size:22px;font-weight:600;letter-spacing:-.5px;
           font-variant-numeric:tabular-nums}
  .atajo span{color:var(--gris);font-size:12px;margin-top:3px;display:block}
  /* LA VOZ. Sin caja y en serif: es lo unico que Zeno escribe, y una cifra es un hecho mientras
     que una frase suya es una opinion. Que se distingan de un vistazo no es decoracion. */
  .resumen-ia{font-family:var(--voz);font-size:17.5px;line-height:1.42;color:#ece9e2;
              margin:4px 0 20px;white-space:pre-wrap}
  .resumen-ia .firma{display:flex;align-items:center;gap:7px;margin-top:12px;color:var(--tenue);
                     font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
                     font-size:11px;white-space:normal}
  .resumen-ia .firma::before{content:"";width:5px;height:5px;border-radius:50%;
                             background:var(--ambar);flex:0 0 auto}

  /* Las cifras van DESNUDAS y con los digitos alineados. Solo se colorea la que va mal: si se
     colorean todas, el color deja de avisar de nada. */
  .negocio{background:var(--carbon);border-radius:14px;padding:14px 15px;margin-bottom:10px;
           border-left:3px solid var(--ambar)}
  .negocio.gutlyn{border-left-color:var(--violeta)}
  .negocio > h2{margin:0 0 2px;font-size:16px;font-weight:600;display:flex;align-items:baseline;
                gap:8px}
  .negocio > h2 em{font-style:normal;font-size:11px;letter-spacing:.7px;text-transform:uppercase;
                   color:var(--gris)}
  .negocio .de{color:var(--gris);font-size:11.5px;margin:0 0 12px}
  /* DOS COLUMNAS y no cuatro en fila. Con los valores reales ("$1,150", "11 meses", "sin dato")
     la cuarta caia sola a la segunda fila y quedaba desalineada. En 2x2 cabe cualquier valor y las
     cuatro se leen alineadas. */
  .cifras{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px 16px}
  .cifra{min-width:0}
  .cifra .v{font-size:18px;font-weight:600;font-variant-numeric:tabular-nums}
  .cifra .k{color:var(--apagado);font-size:10.5px;letter-spacing:.7px;text-transform:uppercase;
            margin-top:2px}
  .cifra.bad .v{color:var(--rojo)}
  .cifra.warn .v{color:var(--ambar)}
  .espera{margin-top:12px;border-top:1px solid var(--linea);padding-top:11px}
  .espera .t{font-size:12.5px;color:var(--gris);margin-bottom:8px}
  .espera .t b{color:var(--ambar);font-size:14px}
  .espera a{display:flex;justify-content:space-between;gap:10px;text-decoration:none;color:inherit;
            padding:8px 0;font-size:13.5px;border-top:1px solid #1e1e24;min-height:34px;
            align-items:center}
  .espera a span{color:var(--ambar);font-weight:600;font-variant-numeric:tabular-nums}

  .login{max-width:360px;margin:0 auto;padding:50px 4px}
  .login .marca{width:64px;height:64px;margin:0 auto 18px}
  .login h1{text-align:center;margin:0 0 4px;font-size:21px}
  .login p{text-align:center;color:var(--gris);margin:0 0 24px;font-size:13px}
  .campo{width:100%;background:#0d0d10;border:1px solid var(--linea);border-radius:10px;
         padding:13px;color:var(--texto);font-size:16px;margin-bottom:11px}
  .grande{width:100%;justify-content:center;padding:13px}
  .error{color:#ffb3aa;font-size:13px;text-align:center;margin-top:12px;min-height:19px}
</style>
</head>
<body>

<!-- ENTRAR -->
<div id="pantalla-login" class="login">
  <svg class="marca" viewBox="0 0 192 192" aria-hidden="true"><rect width="192" height="192" rx="42" fill="#101012"></rect><rect x="40" y="40" width="112" height="24" fill="#f7f7f9"></rect><rect x="40" y="128" width="112" height="24" fill="#f7f7f9"></rect><path d="M140 52 L52 140" stroke="#101012" stroke-width="47"></path><path d="M140 52 L52 140" stroke="#f0a830" stroke-width="24"></path></svg>
  <h1>Zeno</h1>
  <p>Lo que espera tu OK, de los dos negocios</p>
  <!-- LA PUERTA DE CADA DIA: una sola clave, sin codigo de seis cifras, y la sesion dura tres meses.
       La del cockpit sigue debajo, escondida tras el enlace, porque esta clave se suma y no
       sustituye: si algun dia se quita la variable, aquello sigue funcionando. -->
  <div id="paso0">
    <!-- Face ID PRIMERO y grande: es la puerta de cada dia en cuanto esta dado de alta. La clave
         se queda debajo porque tiene que seguir existiendo (un telefono se pierde, y un iPad
         nuevo no tiene la llave todavia), pero deja de ser lo que se ve al abrir. -->
    <button id="btn-cara" class="b primaria grande" hidden>Entrar con Face ID</button>
    <input id="clave" class="campo" type="password" placeholder="clave de Zeno"
           autocomplete="current-password" enterkeyhint="go">
    <button id="btn-clave" class="b primaria grande">Entrar</button>
    <p style="margin:16px 0 0"><a href="#" id="ver-cockpit"
       style="color:var(--gris);font-size:12.5px">entrar con la cuenta del cockpit</a></p>
  </div>
  <div id="paso1" hidden>
    <input id="email" class="campo" type="email" placeholder="correo" autocomplete="username">
    <input id="pass" class="campo" type="password" placeholder="contraseña"
           autocomplete="current-password">
    <button id="btn-entrar" class="b primaria grande">Entrar</button>
  </div>
  <div id="paso2" hidden>
    <p style="margin-bottom:14px">Código de 6 cifras del mismo autenticador que el cockpit</p>
    <input id="codigo" class="campo" inputmode="numeric" autocomplete="one-time-code"
           placeholder="000000">
    <button id="btn-codigo" class="b primaria grande">Comprobar</button>
  </div>
  <div id="error-login" class="error"></div>
</div>

<!-- LA APLICACION -->
<div id="app" hidden style="display:flex;flex-direction:column;height:100%">
  <div class="barra">
    <div style="flex:1;min-width:0">
      <div class="quien"><svg class="marca" viewBox="0 0 192 192" aria-hidden="true"><rect width="192" height="192" rx="42" fill="#101012"></rect><rect x="40" y="40" width="112" height="24" fill="#f7f7f9"></rect><rect x="40" y="128" width="112" height="24" fill="#f7f7f9"></rect><path d="M140 52 L52 140" stroke="#101012" stroke-width="47"></path><path d="M140 52 L52 140" stroke="#f0a830" stroke-width="24"></path></svg><span class="nombre">Zeno</span><span class="va">VA</span></div>
      <span class="fecha" id="fecha"></span>
      <div class="t" id="titulo">Hoy</div>
    </div>
    <button class="icono" id="btn-buscar" aria-label="Buscar">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor"
           stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-3.5-3.5"></path></svg>
    </button>
    <button class="salir" id="btn-salir">salir</button>
  </div>

  <main>
    <div id="tiron"><span class="rueda"></span><span id="tiron-texto"></span></div>
    <section id="v-hoy"></section>
    <!-- TRABAJO se come a Negocios: mirar como va el negocio y decidir que apruebas es el mismo
         momento, y eran dos pestañas que obligaban a saltar entre ellas para decidir una cosa. -->
    <section id="v-trabajo" hidden>
      <div id="v-negocios"></div>
      <div id="v-pendientes"></div>
    </section>
    <section id="v-personal" hidden></section>
  </main>

  <button class="flotante" id="btn-chat" aria-label="Preguntar a Zeno">
    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor"
         stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M21 11.5a8.4 8.4 0 0 1-9 8.4 9 9 0 0 1-3.4-.6L3 21l1.8-4.9A8.3 8.3 0 0 1 3.7 11 8.4 8.4 0 0 1 12 3h.5a8.4 8.4 0 0 1 8.5 8Z"></path>
    </svg>
  </button>

  <nav class="pie">
    <button data-vista="hoy" class="on">Hoy</button>
    <button data-vista="trabajo">Trabajo</button>
    <button data-vista="personal">Personal</button>
  </nav>
</div>

<!-- El chat y buscar son CAPAS, no pestañas: se abren desde donde estes, se usan y se cierran. -->
<div id="capa-chat" class="capa" hidden>
  <div class="cabecera">
    <div class="t">Preguntar a Zeno</div>
    <button class="salir" data-cerrar="capa-chat">cerrar</button>
  </div>
  <div class="cuerpo"><div id="burbujas" class="burbujas"></div></div>
  <div id="escribir" class="escribir">
    <input id="pregunta" placeholder="pregúntale lo que sea" autocomplete="off">
    <button id="mic-pregunta" class="micro" hidden aria-label="Dictar la pregunta">🎤</button>
    <button id="enviar" class="enviar">↑</button>
  </div>
  <div id="dice-pregunta" class="oyendo-texto"></div>
</div>

<div id="capa-cola" class="capa" hidden>
  <div class="cabecera">
    <div class="t" id="cola-titulo">Cola</div>
    <button class="salir" data-cerrar="capa-cola">cerrar</button>
  </div>
  <div class="cuerpo"><div id="cola-cuerpo"></div></div>
</div>

<div id="capa-buscar" class="capa" hidden>
  <div class="cabecera">
    <div class="t">Buscar</div>
    <button class="salir" data-cerrar="capa-buscar">cerrar</button>
  </div>
  <div class="cuerpo">
    <div class="cajabuscar">
      <input id="q" class="buscador" type="search" enterkeyhint="search"
             autocomplete="off" autocapitalize="off" autocorrect="off"
             placeholder="busca en la documentación">
      <button id="limpiar" class="limpiar" hidden aria-label="borrar">✕</button>
      <button id="mic-q" class="micro" hidden aria-label="Buscar dictando">🎤</button>
    </div>
    <div id="dice-q" class="oyendo-texto"></div>
    <div id="resultados"></div>
  </div>
</div>

<script>
// La sesión es el token del cockpit. Se guarda en localStorage dentro de try/catch: en una ventana
// privada el acceso puede lanzar, y eso dejaría la aplicación en blanco sin decir por qué.
const LLAVE = "zeno.token";
const guarda = {
  leer(){ try { return localStorage.getItem(LLAVE) || ""; } catch { return ""; } },
  poner(v){ try { localStorage.setItem(LLAVE, v); } catch {} },
  tirar(){ try { localStorage.removeItem(LLAVE); } catch {} },
};
let token = guarda.leer();
let challenge = "";

// CADA PETICION LLEVA TOPE DE ESPERA. Sin el, `fetch` espera para siempre: si el movil cambia de
// wifi a datos, o si el servicio se reinicia (un despliegue corta lo que este en curso), la
// peticion se queda muerta y la pantalla con el "pensando…" puesto, sin error y sin forma de
// salir de ahi. Es lo que el operador vio: *"el chat se queda colgado varias veces"*. El servidor
// contestaba 200 a todo; lo que faltaba era rendirse a tiempo en el navegador.
//
// Dos topes, porque no todo tarda igual: preguntarle algo a Zeno pasa por un modelo y puede tardar
// medio minuto; leer una lista, no. Un tope unico obliga a elegir entre cortar lo lento o esperar
// de mas en lo rapido.
const ESPERA = 20000;
const ESPERA_LARGA = 75000;
const LENTAS = ["/api/chat", "/api/hoy", "/api/correo/redactar", "/api/pendientes",
                "/api/negocios", "/api/personal", "/api/orden", "/api/cola"];

async function api(ruta, opciones = {}) {
  const tope = LENTAS.some(l => ruta.startsWith(l)) ? ESPERA_LARGA : ESPERA;
  const corta = new AbortController();
  const reloj = setTimeout(() => corta.abort(), tope);
  let r;
  try {
    r = await fetch(ruta, {
      ...opciones,
      signal: corta.signal,
      headers: { "Content-Type": "application/json",
                 ...(token ? { Authorization: "Bearer " + token } : {}),
                 ...(opciones.headers || {}) },
    });
  } catch (e) {
    // Se distingue rendirse por tiempo de no haber red: son dos cosas distintas y llevan a hacer
    // dos cosas distintas. "Failed to fetch" a secas no dice ninguna de las dos.
    throw new Error(e.name === "AbortError"
      ? "ha tardado demasiado y lo he dejado. Vuelve a intentarlo"
      : "no he podido conectar: mira la cobertura");
  } finally {
    clearTimeout(reloj);
  }
  if (r.status === 401) { salir(); throw new Error("sesión caducada"); }
  const datos = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(datos.detail || ("error " + r.status));
  return datos;
}

const $ = (s) => document.querySelector(s);
const esc = (t) => String(t ?? "").replace(/[&<>"]/g, c =>
  ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

// ---------------------------------------------------------------- entrar
//
// Dos puertas. La de cada dia es UNA clave; la del cockpit se queda por debajo para el dia que la
// clave propia no este puesta o haya que quitarla.

async function entrarConClave() {
  $("#error-login").textContent = "";
  const c = $("#clave").value;
  if (!c) return;
  const b = $("#btn-clave");
  b.disabled = true; b.textContent = "comprobando…";
  try {
    const r = await api("/api/entrar", { method: "POST", body: JSON.stringify({ clave: c }) });
    $("#clave").value = "";
    dentro(r.token);
  } catch (e) {
    $("#error-login").textContent = e.message;
  } finally {
    b.disabled = false; b.textContent = "Entrar";
  }
}

function puertaDelCockpit() {
  $("#paso0").hidden = true;
  $("#paso1").hidden = false;
  $("#error-login").textContent = "";
  $("#email").focus();
}

// Si no hay clave propia puesta en el servidor, se ensena directamente la del cockpit: una casilla
// que no puede funcionar es peor que no ensenarla.
(async () => {
  try {
    const d = await (await fetch("/api/como_se_entra")).json();
    if (!d.clave_propia) puertaDelCockpit();
  } catch { puertaDelCockpit(); }
})();

async function entrar() {
  $("#error-login").textContent = "";
  try {
    const r = await api("/api/login", { method: "POST", body: JSON.stringify({
      email: $("#email").value.trim(), password: $("#pass").value }) });
    if (r.twofa_required) { challenge = r.challenge; $("#paso1").hidden = true;
                            $("#paso2").hidden = false; $("#codigo").focus(); return; }
    dentro(r.token);
  } catch (e) { $("#error-login").textContent = e.message; }
}

async function comprobarCodigo() {
  $("#error-login").textContent = "";
  try {
    const r = await api("/api/login/2fa", { method: "POST", body: JSON.stringify({
      challenge, code: $("#codigo").value.trim() }) });
    dentro(r.token);
  } catch (e) { $("#error-login").textContent = e.message; }
}

function dentro(t) {
  token = t; guarda.poner(t);
  cargaColasAbribles().then(() => { if (!$("#v-trabajo").hidden) cargaPendientes(); });
  $("#pantalla-login").hidden = true; $("#app").hidden = false;
  ver("hoy");
  ofreceLaCara();
}

// Se ofrece UNA vez y no se insiste: si dice que no, no vuelve a salir hasta que se borre el
// recuerdo. Una aplicacion que pregunta lo mismo cada vez que la abres enseña a decir que no sin
// leer. Y solo si no hay ninguna dada de alta: no tiene sentido pedirlo dos veces al mismo movil.
async function ofreceLaCara() {
  if (!hayCara) return;
  try { if (localStorage.getItem("zeno.cara.no")) return; } catch {}
  let estado;
  try { estado = await api("/api/rostro"); } catch { return; }
  if (estado.hay) return;
  const caja = document.createElement("div");
  caja.className = "tarjeta";
  caja.style.margin = "0 0 14px";
  caja.innerHTML = '<div class="post">Entra con Face ID</div>' +
    '<div class="extracto">Para no escribir la clave cada vez. Se queda en el llavero del ' +
    'teléfono, así que no se pierde aunque iOS limpie los datos del sitio.</div>' +
    '<div class="btns"><button class="b primaria" id="cara-si">Activarlo</button>' +
    '<button class="b" id="cara-no">Ahora no</button></div>';
  const donde = document.querySelector("main");
  if (!donde) return;
  donde.insertBefore(caja, donde.firstChild);
  caja.querySelector("#cara-no").onclick = () => {
    try { localStorage.setItem("zeno.cara.no", "1"); } catch {}
    caja.remove();
  };
  caja.querySelector("#cara-si").onclick = async () => {
    caja.querySelector(".extracto").textContent = "mira el teléfono…";
    try {
      const r = await darDeAltaLaCara();
      if (!r) { caja.querySelector(".extracto").textContent = "lo has cancelado"; return; }
      caja.querySelector(".post").textContent = "Listo, ya puedes entrar con Face ID";
      caja.querySelector(".extracto").textContent = r.apodo;
      caja.querySelector(".btns").remove();
      setTimeout(() => caja.remove(), 4000);
    } catch (e) {
      caja.querySelector(".extracto").textContent = e.message || "no he podido activarlo";
    }
  };
}

function salir() {
  if (token) fetch("/api/salir", { method: "POST",
                                   headers: { Authorization: "Bearer " + token } }).catch(() => {});
  token = ""; guarda.tirar();
  $("#app").hidden = true; $("#pantalla-login").hidden = false;
  $("#paso0").hidden = false; $("#paso1").hidden = true; $("#paso2").hidden = true;
  $("#pass").value = ""; $("#clave").value = "";
}

// ---------------------------------------------------------------- lo que espera tu OK
function pintaAccion(a, i, j) {
  // Lo que ABRE se pinta como ENLACE de verdad: decisión del operador (27-sep), lo irreversible no
  // puede ser lo más fácil de pulsar con el pulgar.
  //
  // Desde J4 lo que EJECUTA también es un botón, pero de dos tiempos: pulsarlo no hace nada todavía,
  // abre la confirmación. Y lo que sale al mundo pide el PIN.
  if (!a.op) return `<span class="b sin">${esc(a.etiqueta)} · sin contrato</span>`;
  const marcas = [];
  if (a.coste_api) marcas.push('<span class="marca-accion m-cuesta">cuesta</span>');
  const texto = `${esc(a.etiqueta)} ${marcas.join(" ")}`;
  if (a.se_puede_abrir)
    return `<a class="b primaria" href="${esc(a.url)}" target="_blank" rel="noopener">${texto}</a>`;
  // Lo que publica NO es el botón primario: el primario es el de abrir y mirar. Que lo irreversible
  // se vea menos llamativo que lo inocente es a propósito.
  // Lo que publica va en contorno rojo, no en el boton solido: el solido es el de ABRIR y mirar.
  const clase = a.efecto === "publica" ? "b gasta" : "b";
  return `<button class="${clase}" data-hacer="${i}-${j}">${texto}</button>`;
}

// Que colas se pueden abrir enteras. Se PREGUNTA al servidor en vez de escribirlo aqui: una
// lista a mano se queda vieja en cuanto el cockpit añade o quita una, y sin fallar.
let colasAbribles = { cockpit: [], xrise: [] };

async function cargaColasAbribles() {
  try { colasAbribles = (await api("/api/colas")).colas || colasAbribles; } catch {}
}

//: La cola abierta ahora, para que los botones sepan a que elemento pertenecen.
let colaEnPantalla = [];

//: Cuanto lleva esperando algo, que es lo util. La fecha exacta no la lee nadie.
function desdeCuando(cuando) {
  const d = new Date(cuando);
  if (isNaN(d)) return String(cuando).slice(0, 10);
  const dias = Math.floor((Date.now() - d.getTime()) / 86400000);
  if (dias <= 0) return "hoy";
  if (dias === 1) return "ayer";
  if (dias < 14) return "hace " + dias + " días";
  if (dias < 60) return "hace " + Math.floor(dias / 7) + " semanas";
  return "hace " + Math.floor(dias / 30) + " meses";
}

let colaAbierta = null;

async function abreCola(cola, titulo) {
  colaAbierta = { cola, titulo };
  const capa = $("#capa-cola");
  $("#cola-titulo").textContent = titulo || cola;
  $("#cola-cuerpo").innerHTML = '<div class="cargando">cargando…</div>';
  capa.hidden = false;
  try {
    const d = await api("/api/cola/" + encodeURIComponent(cola) + "?limite=50");
    colaEnPantalla = d.elementos || [];
    let h = "";
    for (const f of d.fallos || []) h += '<div class="aviso-fallo">' + esc(f) + "</div>";
    // POR QUE la lista es la que es. Sin esto, ver solo respuestas se lee como una averia cuando
    // lo que pasa es que el cupo del dia ya esta gastado y no toca mandar mas invitaciones.
    const r = d.resumen || {};
    if (r.cupo)
      h += '<div class="extracto" style="margin-bottom:12px">' +
           (r.quedan_hoy > 0
             ? "Quedan " + r.quedan_hoy + " invitaciones de las " + r.cupo + " de hoy."
             : "Las " + r.cupo + " invitaciones de hoy ya están hechas: abajo solo quedan las " +
               "respuestas por contestar. Mañana vuelven las notas.") +
           (r.por_conectar ? " Esperando en la cola: " + r.por_conectar + "." : "") + "</div>";
    if (!colaEnPantalla.length) h += '<div class="vacio">Nada aquí. Cola vacía.</div>';
    colaEnPantalla.forEach((e, i) => {
      h += '<div class="tarjeta"><div class="neg">' + esc(e.negocio) +
           (e.paso ? ' <span style="color:var(--ambar)">' + esc(e.paso) + "</span>" : "") +
           (e.fuera_de_cupo ? ' <span class="marca-accion m-mundo">pasa del cupo de hoy</span>' : "") +
           (e.cuando ? ' <span style="color:var(--apagado)">' + esc(desdeCuando(e.cuando)) + "</span>" : "") +
           "</div><div class=\"post\">" + esc(e.titulo) + "</div>" +
           (e.cuerpo ? '<div class="extracto">' + esc(e.cuerpo) + "</div>" : "") +
           (e.copiar ? '<div class="para-pegar">' + esc(e.copiar) + "</div>" : "") +
           '<div class="btns">' +
           // El trio que cierra el circulo: IR al sitio, COPIAR el texto y MARCAR. Copiar va
           // antes que marcar a proposito: es el orden en que se hace.
           (e.donde ? '<a class="b primaria" href="' + esc(e.donde) + '" target="_blank" ' +
                      'rel="noopener">Ir y responder</a>' : "") +
           (e.copiar ? '<button class="b" data-copiar="' + i + '">Copiar</button>' : "");
      let pintados = 0;
      (e.acciones || []).forEach((a, j) => {
        if (a.se_puede_abrir) {
          h += '<a class="b" href="' + esc(a.url) + '" target="_blank" rel="noopener">' +
               esc(a.etiqueta) + "</a>";
          pintados++;
        } else if (a.url && /^https?:/.test(a.url) && a.op && a.se_puede_ejecutar !== false) {
          h += '<button class="b' + (a.efecto === "publica" ? " primaria" : "") +
               '" data-cola-accion="' + i + "-" + j + '">' + esc(a.etiqueta) + "</button>";
          pintados++;
        }
      });
      if (!pintados && !e.donde && !e.copiar)
        h += '<span class="extracto">Esto se hace en el cockpit</span>';
      h += "</div></div>";
    });
    $("#cola-cuerpo").innerHTML = h + '<div class="confirmar-aqui"></div>';
    $("#cola-cuerpo").querySelectorAll("[data-copiar]").forEach(b => b.onclick = async () => {
      const texto = colaEnPantalla[Number(b.dataset.copiar)].copiar || "";
      try {
        await navigator.clipboard.writeText(texto);
        b.textContent = "Copiado";
      } catch (e) {
        // En iOS el portapapeles falla si no lo pide un gesto, y a veces falla igual. Antes de
        // dejar al operador sin el texto, se enseña para que lo seleccione a mano.
        b.textContent = "no he podido, míralo abajo";
        b.closest(".tarjeta").insertAdjacentHTML("beforeend",
          '<textarea class="campo" rows="4" readonly>' + esc(texto) + "</textarea>");
      }
      setTimeout(() => { if (b.textContent === "Copiado") b.textContent = "Copiar"; }, 2500);
    });
    $("#cola-cuerpo").querySelectorAll("[data-cola-accion]").forEach(b => b.onclick = () => {
      const [i, j] = b.dataset.colaAccion.split("-").map(Number);
      // El MISMO camino que en el resto: propone, enseña lo que va a pasar y espera el OK. Una
      // lista larga no es motivo para saltarse la confirmacion; al reves.
      proponeAccion({ titulo: colaEnPantalla[i].titulo }, colaEnPantalla[i].acciones[j]);
    });
  } catch (e) {
    $("#cola-cuerpo").innerHTML = '<div class="aviso-fallo">' + esc(e.message) + "</div>";
  }
}

function pintaColas(colas, total) {
  if (!colas.length) return "";
  // FICHAS, no ocho cajas con un numero gigante. La pregunta que contesta esto es "cuanto queda y
  // de que", y se contesta de un vistazo en una fila.
  let h = '<div class="apartado">Esperan tu OK<span style="flex:1"></span>' +
          '<span style="color:var(--apagado);font-variant-numeric:tabular-nums">' + total +
          "</span></div><div class=\"fichas\">";
  for (const c of colas) {
    if (!c.cuantos) continue;
    const abribles = [...(colasAbribles.cockpit || []), ...(colasAbribles.xrise || [])];
    const abrible = abribles.includes(c.cola);
    h += abrible
      ? '<button class="ficha abrible" data-cola="' + esc(c.cola) + '"><b>' + c.cuantos +
        "</b><span>" + esc(c.titulo) + '</span><span class="flecha">›</span></button>'
      : '<div class="ficha"><b>' + c.cuantos + "</b><span>" + esc(c.titulo) + "</span></div>";
  }
  return h + "</div>";
}

async function cargaPendientes() {
  const c = $("#v-pendientes");
  c.innerHTML = '<div class="cargando">cargando…</div>';
  try {
    const d = await api("/api/pendientes");
    let html = "";
    // Los fallos van ARRIBA y siempre: una lista corta sin aviso se lee como "hay poco pendiente".
    for (const f of d.fallos || []) html += `<div class="aviso-fallo">No se ha podido leer ${esc(f)}</div>`;
    // El recuento COMPLETO va arriba del todo: el feed de abajo da lo que toca hoy, y sin esto
    // parecía que solo había una cosa pendiente cuando había 113.
    html += pintaColas(d.colas || [], d.total_pendiente);
    html += '<div id="colas-de-hoy"></div>';
    const lista = d.pendientes || [];
    if (!lista.length) {
      html += '<div class="vacio">nada espera tu OK' +
              ((d.fallos || []).length ? "<br>(con lo que se ha podido leer)" : "") + "</div>";
    } else {
      // Aqui iba un "1 cosa espera tu OK" justo debajo del recuento de 113: dos numeros
      // distintos para la misma pregunta, y el de arriba es el bueno. El feed no cuenta, decide.
      html += '<div class="apartado">Lo que toca ahora</div>';
      // La lista se guarda: al confirmar hace falta la accion entera, y volver a pedirla al
      // servidor entre proponer y confirmar podria traer otra distinta si algo cambio entremedias.
      pendientesEnPantalla = lista;
      for (let i = 0; i < lista.length; i++) {
        const p = lista[i];
        html += `<div class="tarjeta">
          <div class="neg ${p.negocio === "GutLyn" ? "gutlyn" : ""}">${esc(p.negocio)}</div>
          <div class="post">${esc(p.titulo)}</div>
          ${p.cuerpo ? `<div class="extracto">${esc(p.cuerpo.slice(0, 260))}</div>` : ""}
          <div class="btns">${(p.acciones || []).map((a, j) => pintaAccion(a, i, j)).join("")}</div>
        </div>`;
      }
    }
    // Los avisos que NO traen boton: no se deciden desde aqui, pero existen. Van al final y
    // enlazan al sistema, para que Zeno no enseñe menos de lo que sabe.
    // Los avisos que NO traen boton del sistema: ahora con su CUERPO, para saber de que van sin
    // abrir el cockpit, y con el boton de cerrar si son tareas.
    const sueltos = d.avisos || [];
    avisosEnPantalla = sueltos;
    if (sueltos.length) {
      html += '<div class="apartado">También avisan<span style="flex:1"></span>' +
              '<span style="color:var(--apagado)">' + sueltos.length + "</span></div>";
      for (let i = 0; i < sueltos.length; i++) {
        const a = sueltos[i];
        html += '<div class="tarjeta"><div class="neg ' +
                (a.negocio === "GutLyn" ? "gutlyn" : "") + '">' + esc(a.negocio) +
                (a.grave ? ' <span class="marca-accion m-mundo">urgente</span>' : "") + "</div>" +
                '<div class="post">' + esc(a.titulo) + "</div>" +
                (a.cuerpo ? '<div class="extracto">' + esc(a.cuerpo) + "</div>" : "") +
                '<div class="btns">' +
                (a.url ? '<a class="b" href="' + esc(a.url) + '" target="_blank" rel="noopener">' +
                         "Abrirlo</a>" : "");
        (a.acciones || []).forEach((_, j) => {
          html += '<button class="b" data-aviso="' + i + "-" + j + '">' +
                  esc(a.acciones[j].etiqueta) + "</button>";
        });
        html += "</div></div>";
      }
    }
    c.innerHTML = html + '<div class="confirmar-aqui"></div><div id="lo-hecho"></div>';
    pintaHecho();
    // Las dos colas del trabajo de hoy se piden APARTE y despues de pintar: tardan mas (el
    // cockpit calcula el reparto del dia) y no tienen por que retrasar el resto de la pantalla.
    pintaColasDeHoy();
    c.querySelectorAll("[data-aviso]").forEach(b => b.onclick = () => {
      const [i, j] = b.dataset.aviso.split("-").map(Number);
      const a = avisosEnPantalla[i];
      proponeAccion({ titulo: a.titulo }, a.acciones[j]);
    });
    c.querySelectorAll("[data-hacer]").forEach(b => b.onclick = () => {
      const [i, j] = b.dataset.hacer.split("-").map(Number);
      proponeAccion(pendientesEnPantalla[i], pendientesEnPantalla[i].acciones[j]);
    });
  } catch (e) { c.innerHTML = `<div class="aviso-fallo">${esc(e.message)}</div>`; }
}

// ---------------------------------------------------------------- ejecutar, en dos tiempos
//
// J4. Hasta aqui Zeno enseñaba y enlazaba; esto aprueba de verdad, y aprobar un post lo publica en
// ese momento. Por eso pulsar el boton NO ejecuta: abre una confirmacion que dice con todas las
// letras lo que va a pasar, y lo que sale al mundo pide ademas el PIN.

let pendientesEnPantalla = [];
let avisosEnPantalla = [];
let accionViva = null;

// Donde se pinta la confirmacion: en la capa abierta si la hay, y si no en la vista de debajo.
// Habia DOS elementos con el mismo id y `querySelector` devolvia el primero, o sea la de debajo:
// pulsabas un boton dentro de una cola y la confirmacion aparecia detras, invisible. Pulsar y que
// no pase nada visible es la peor forma de fallar en algo que publica.
function dondeConfirmar() {
  const capa = document.querySelector(".capa:not([hidden]) .confirmar-aqui");
  return capa || document.querySelector(".confirmar-aqui");
}

// Lo reversible, de un toque: se pide el vale y se confirma seguido. El vale sigue existiendo
// (es de un solo uso y deja rastro en el diario), lo que desaparece es el paso que no aportaba.
async function hazDirecto(pendiente, accion) {
  try {
    const pr = await api("/api/accion/proponer", { method: "POST", body: JSON.stringify({
      op: accion.op, etiqueta: accion.etiqueta, url: accion.url, efecto: accion.efecto,
      coste_api: !!accion.coste_api, titulo: pendiente.titulo,
      metodo: accion.metodo || "GET", cuerpo: accion.cuerpo || null }) });
    const d = await api("/api/accion/confirmar", { method: "POST",
                                                   body: JSON.stringify({ vale: pr.vale }) });
    if (!d.hecho) throw new Error(d.detalle || "no ha salido");
    if (colaAbierta && !$("#capa-cola").hidden) abreCola(colaAbierta.cola, colaAbierta.titulo);
    else cargaPendientes();
  } catch (e) {
    dondeConfirmar().innerHTML = '<div class="aviso-fallo">' + esc(e.message) + "</div>";
  }
}

function _pideConfirmacion(accion) {
  return accion.efecto === "publica" || !!accion.coste_api || accion.reversible === false;
}

async function proponeAccion(pendiente, accion) {
  const caja = dondeConfirmar();
  try {
    if (!_pideConfirmacion(accion)) return hazDirecto(pendiente, accion);
    const pr = await api("/api/accion/proponer", { method: "POST", body: JSON.stringify({
      op: accion.op, etiqueta: accion.etiqueta, url: accion.url, efecto: accion.efecto,
      coste_api: !!accion.coste_api, titulo: pendiente.titulo,
      metodo: accion.metodo || "GET", cuerpo: accion.cuerpo || null }) });
    accionViva = pr;
    let h = '<div class="propuesta"><div class="q">' + esc(pr.etiqueta) + "</div>" +
            '<div class="c">' + esc(pr.titulo || "") + "</div>";
    if (pr.sale_al_mundo)
      h += '<div class="ojo"><b>Esto se publica ahora y no se puede deshacer.</b></div>';
    if (pr.cuesta_dinero)
      h += '<div class="ojo">Gasta API.</div>';
    h += '<div class="btns"><button class="b primaria" id="hacer-ya">' +
         (pr.sale_al_mundo ? "Publicar" : "Hacerlo") +
         '</button><button class="b sin" id="hacer-no">Dejarlo</button></div></div>';
    caja.innerHTML = h;
    caja.scrollIntoView({ block: "center" });
    $("#hacer-no").onclick = () => { accionViva = null; caja.innerHTML = ""; };
    $("#hacer-ya").onclick = () => haceAccion();
  } catch (e) {
    caja.innerHTML = '<div class="aviso-fallo">' + esc(e.message) + "</div>";
  }
}

async function haceAccion() {
  if (!accionViva) return;
  const b = $("#hacer-ya");
  b.disabled = true; b.textContent = "…";
  try {
    const r = await fetch("/api/accion/confirmar", {
      method: "POST",
      headers: { "Content-Type": "application/json", Authorization: "Bearer " + token },
      body: JSON.stringify({ vale: accionViva.vale }) });
    // 428 es "falta el PIN", no "sesion mala": se pide el PIN y se reintenta con el MISMO vale.
    if (r.status === 428) {
      b.disabled = false; b.textContent = "Publicar";
      const pin = prompt("PIN para publicar");
      if (!pin) return;
      try {
        await api("/api/pin", { method: "POST", body: JSON.stringify({ pin }) });
      } catch (e) { alert(e.message); return; }
      return haceAccion();
    }
    const d = await r.json().catch(() => ({}));
    if (!r.ok) throw new Error(d.detail || ("error " + r.status));
    accionViva = null;
    dondeConfirmar().innerHTML =
      '<div class="propuesta"><div class="q">Hecho: ' + esc(d.etiqueta) + "</div>" +
      '<div class="c">' + esc(d.titulo || "") + (d.salio_al_mundo ? " · ya está publicado" : "") +
      "</div></div>";
    // Se recarga LO QUE SE ESTA MIRANDO. Si hay una cola abierta, esa: recargar la pantalla de
    // debajo dejaba la tarjeta ahi y parecia que el boton no habia hecho nada.
    if (colaAbierta && !$("#capa-cola").hidden) abreCola(colaAbierta.cola, colaAbierta.titulo);
    else cargaPendientes();
  } catch (e) {
    b.disabled = false; b.textContent = "Publicar";
    dondeConfirmar().insertAdjacentHTML("beforeend",
      '<div class="aviso-fallo">' + esc(e.message) + "</div>");
  }
}

// ---------------------------------------------------------------- lo que Zeno ha hecho
//
// Aparecio con J4: desde que Zeno publica, la primera pregunta al ver algo publicado que no
// recuerdas es si salio desde aqui.
//
// UNA LINEA, NO UNA LISTA (2026-09-29). El operador, con una captura donde esto eran veintitantas
// tarjetas de "Saltar hoy" y el trabajo de verdad quedaba por debajo del pliegue: *"el historico
// realizado en trabajo no deberia sobrevivir mas de un dia, si no puede ser una lista
// interminable. Ponlo de otra manera que se vea, pero que se autoborre cada dia"*.
//
// Asi que se resume: "23 cosas · 14 saltar hoy, 6 respondi, 3 publicado", y el detalle se despliega
// solo si se toca. Lo que casi siempre se quiere saber es CUANTO llevas, no cada linea.
//
// Y solo sale lo de HOY: el servidor filtra por el dia y el diario tira lo que pasa de dos dias.
// Dos y no uno por la frontera de medianoche, que si no a las 00:05 la pantalla sale vacia justo
// despues de haber estado trabajando.

async function pintaHecho() {
  const caja = $("#lo-hecho");
  if (!caja) return;
  let d;
  try { d = await api("/api/hecho"); } catch { return; }
  if (!d.cuantas) { caja.innerHTML = ""; return; }   // un dia sin nada no gasta ni una linea

  const trozos = (d.resumen || []).map(r => r.cuantas + " " + r.que.toLowerCase());
  const dudosas = d.dudosas
    ? ' <span class="marca-accion m-mundo">' + d.dudosas + " sin confirmar</span>" : "";

  caja.innerHTML =
    '<div class="apartado">Hoy has hecho</div>' +
    '<button class="cuenta" id="hecho-abrir" style="width:100%;text-align:left;border:0;' +
    'font:inherit;color:inherit;cursor:pointer">' +
    '<div class="c"><b>' + d.cuantas + (d.cuantas === 1 ? " cosa" : " cosas") + dudosas +
    '</b><span>' + esc(trozos.join(" · ") || "") + "</span></div>" +
    '<span style="color:var(--apagado);font-size:18px" id="hecho-flecha">›</span></button>' +
    '<div id="hecho-detalle" hidden></div>';

  $("#hecho-abrir").onclick = () => {
    const det = $("#hecho-detalle");
    det.hidden = !det.hidden;
    $("#hecho-flecha").textContent = det.hidden ? "›" : "⌄";
    // Se pinta la PRIMERA vez que se abre, no al cargar: si no, la lista larga seguiria
    // construyendose entera en cada visita aunque nadie la mire.
    if (!det.dataset.puesto) {
      det.innerHTML = (d.hecho || []).map(x => {
        const cuando = new Date((x.cuando || 0) * 1000);
        const marca = x.resultado === "no_se_sabe"
          ? '<span class="marca-accion m-mundo">no se sabe</span>'
          : x.resultado === "error" ? '<span class="marca-accion m-mundo">falló</span>'
          : x.publica ? '<span class="marca-accion m-cuesta">publicado</span>' : "";
        return '<div class="ficha" style="align-items:flex-start"><span style="flex:1">' +
               esc(x.etiqueta || x.op) + " " + marca +
               '<span style="display:block;color:var(--apagado);font-size:11.5px;margin-top:2px">' +
               esc(x.titulo || "") + " · " +
               cuando.toLocaleTimeString("es-ES", { hour: "2-digit", minute: "2-digit" }) +
               "</span></span></div>";
      }).join("");
      det.dataset.puesto = "1";
    }
  };
}

// ---------------------------------------------------------------- buscar
let tecleando;

// Una pantalla en blanco con una caja no dice que se puede preguntar. Estas cuatro salen de lo que
// el corpus responde bien, comprobado contra produccion.
const EJEMPLOS = ["fórmula de precios", "tope diario de arcos", "cadencia de Claire",
                  "guardas de gasto de API"];
function sugerencias() {
  return `<div class="resumen">Prueba con</div><div class="sugerencias">` +
    EJEMPLOS.map(e => `<button class="sug" data-q="${esc(e)}">${esc(e)}</button>`).join("") +
    `</div>`;
}
async function busca() {
  const q = $("#q").value.trim();
  const c = $("#resultados");
  $("#limpiar").hidden = !q;
  if (q.length < 2) { c.innerHTML = sugerencias(); return; }
  try {
    const d = await api("/api/buscar?q=" + encodeURIComponent(q));
    let html = "";
    if (d.modo === "texto")
      html += '<div class="degradado">Buscando solo por texto: el servicio de significado no responde</div>';
    if (d.modo === "no disponible")
      html += '<div class="aviso-fallo">El corpus no está disponible ahora mismo</div>';
    const res = d.resultados || [];
    if (!res.length) {
      html += `<div class="vacio">nada en la documentación sobre eso</div>`;
    } else {
      html += `<div class="resumen">${res.length} documento${res.length === 1 ? "" : "s"}</div>`;
      for (const r of res) {
        // El fragmento que RESPONDE va entero, no cortado a una linea: leerlo es lo que evita
        // abrir el documento para nada, y en el movil hay sitio de sobra a lo alto.
        const trozo = r.trozo || (r.sub || "").replace(/^\d+%\s*·\s*/, "");
        const puntos = r.puntos ?? parseInt((r.sub || "").match(/^(\d+)%/)?.[1] ?? "", 10);
        html += `<a class="doc" href="https://cockpit.zenvrax.com/conocimiento" target="_blank"
                    rel="noopener">
          ${Number.isFinite(puntos) ? `<div class="p">${puntos}% de coincidencia</div>` : ""}
          <div class="t">${esc(r.title || r.id || "?")}</div>
          ${trozo ? `<div class="s">${esc(trozo)}</div>` : ""}
        </a>`;
      }
    }
    c.innerHTML = html;
  } catch (e) { c.innerHTML = `<div class="aviso-fallo">${esc(e.message)}</div>`; }
}

//: El trabajo del dia que se hace EN otra aplicacion: los DMs de LinkedIn y el engagement de X.
//: Se piden aparte porque no son contenido en una tabla, y su numero cambia cada dia.
const COLAS_DE_HOY = [["dms", "DMs y respuestas de LinkedIn"], ["engagement", "Cuentas de X para responder"]];

async function pintaColasDeHoy() {
  const caja = $("#colas-de-hoy");
  if (!caja) return;

    try {

      if (!d.cuantos) return "";
      return '<button class="ficha abrible" data-cola="' + cola + '"><b>' + d.cuantos +
             "</b><span>" + esc(titulo) + '</span><span class="flecha">›</span></button>';
    } catch (e) {
      return '<div class="ficha"><b>?</b><span>' + esc(titulo) + ": " + esc(e.message) + "</span></div>";
    }
  }));

    ? '<div class="apartado">El trabajo de hoy</div><div class="fichas">' + hay + "</div>"

// ---------------------------------------------------------------- chat (apagado)
function burbuja(clase, texto) {
  const d = document.createElement("div");
  d.className = clase; d.textContent = texto;
  $("#burbujas").appendChild(d);
  d.scrollIntoView({ block: "end" });
  return d;
}

// Devuelve lo que contesto Zeno, para que la conversacion por voz pueda decirlo en alto. Con
// `desde` se le pasa una frase ya dictada en vez de leerla del campo.
async function preguntar(desde) {
  const caja = $("#pregunta");
  const texto = (desde !== undefined ? desde : caja.value).trim();
  if (texto.length < 2) return "";
  let dicho = "";
  if (desde === undefined) caja.value = "";
  // Lo hablado antes viaja con la pregunta. Se lee de la PANTALLA, que es la verdad de lo que
  // el operador esta viendo. El servidor ADEMAS la guarda desde el 28-sep, para poder retomarla
  // manana: el motivo por el que antes no se guardaba ("la conversacion se acaba al cerrar la
  // aplicacion") era justamente el problema.
  const turnos = [...document.querySelectorAll("#burbujas .tu, #burbujas .el")]
    .map(b => ({ de: b.classList.contains("tu") ? "yo" : "zeno", texto: b.textContent }))
    .filter(t => t.texto && t.texto !== "pensando…");
  burbuja("tu", texto);
  const esperando = burbuja("el", "pensando…");
  try {
    const r = await api("/api/chat", { method: "POST",
                                       body: JSON.stringify({ texto, turnos }) });
    esperando.textContent = r.respuesta || "(sin respuesta)";
    dicho = r.respuesta || "";
    // El coste va DEBAJO de cada respuesta, no escondido en un ajuste: es la unica pieza de Zeno
    // cuyo gasto lo decide el uso, y verlo es lo que evita la sorpresa a fin de mes.
    const c = document.createElement("div");
    c.className = "coste";
    c.textContent = `$${(r.coste_usd ?? 0).toFixed(4)} · ${r.modelo} · ` +
                    `${r.preguntas_hoy}/${r.tope_diario} preguntas hoy`;
    $("#burbujas").appendChild(c);
    c.scrollIntoView({ block: "end" });
  } catch (e) {
    esperando.textContent = e.message;
    dicho = e.message;
  }
  return dicho;
}

async function cargaChat() {
  if ($("#burbujas").children.length) return;
  // SE RETOMA LO ULTIMO QUE SE HABLO. Antes, cerrar la aplicacion borraba la conversacion y
  // volver era empezar de cero con alguien que se te olvida entre frase y frase.
  let h = null;
  try { h = await api("/api/hilo"); } catch { h = null; }
  // SE VUELVE A MIRAR despues de la espera. Lo cazo el comprobador en produccion: mientras el
  // servidor contestaba, el operador ya habia escrito, y el saludo aparecia DEBAJO de la
  // respuesta como si Zeno acabara de empezar.
  if ($("#burbujas").children.length) return;
  if (h && (h.turnos || []).length) {
    const sep = document.createElement("div");
    sep.className = "coste";
    sep.style.textAlign = "center";
    sep.textContent = "lo último que hablamos, " + cuando(h.ultima_vez);
    $("#burbujas").appendChild(sep);
    for (const t of h.turnos) burbuja(t.de === "zeno" ? "el" : "tu", t.texto);
    return;
  }
  burbuja("el", "Pregúntame por lo que tienes pendiente, cómo van los negocios o qué dice la " +
                "documentación. Lo que se puede hacer desde aquí sale con su botón, y " +
                "siempre te lo pregunto antes de hacerlo. Si me dices \"recuerda que...\" lo " +
                "apunto y no se me olvida.");
}

// Una fecha en palabras. Un apunte SIN fecha se lee como vigente hoy aunque sea de hace un mes,
// y esa es justo la forma en que una memoria acaba mintiendo con seguridad.
function cuando(marca) {
  if (!marca) return "hace tiempo";
  const seg = Date.now() / 1000 - marca;
  if (seg < 3600) return "hace " + Math.max(1, Math.round(seg / 60)) + " min";
  if (seg < 86400) return "hace " + Math.round(seg / 3600) + " h";
  if (seg < 172800) return "ayer";
  const d = new Date(marca * 1000);
  return d.toLocaleDateString("es-ES", { day: "numeric", month: "short" });
}

// ---------------------------------------------------------------- lo primero de la mañana
//
// Corto a proposito. El operador eligio ver aqui el foco y lo urgente, y nada mas: las cifras estan
// en Negocios y el correo en Personal. Una pantalla de entrada que lo repite todo se deja de leer.
//
// El resumen escrito se cachea POR DIA en el servidor, asi que abrir la aplicacion varias veces por
// la mañana cuesta una sola llamada.

async function cargaHoy() {
  const c = $("#v-hoy");
  if (!c.innerHTML) c.innerHTML = '<div class="cargando">cargando…</div>';
  try {
    const d = await api("/api/hoy");
    let h = "";
    for (const f of d.fallos || []) h += '<div class="aviso-fallo">' + esc(f) + "</div>";

    if (d.resumen)
      h += '<div class="resumen-ia">' + esc(d.resumen.texto) +
           '<span class="firma">Zeno, con ' + esc(d.resumen.modelo) +
           (d.resumen.de_cache ? " · escrito hoy" :
            " · " + (d.resumen.coste_usd || 0).toFixed(4) + " USD") + "</span></div>";

    const plan = d.plan || {};
    if (plan.foco) {
      // El foco es un ENLACE cuando trae dirección. Era un div: la cosa más importante del día,
      // en la tarjeta más grande de la pantalla, y al pulsarla no pasaba nada.
      h += (plan.foco.url
              ? '<a class="foco" href="' + esc(plan.foco.url) + '" target="_blank" rel="noopener">'
              : '<div class="foco">') +
           '<div class="q">Lo primero de hoy</div><div class="t">' +
           esc(plan.foco.titulo) + "</div>";
      if (plan.foco.cuerpo) h += '<div class="c">' + esc(plan.foco.cuerpo) + "</div>";
      h += plan.foco.url ? "</a>" : "</div>";
    }

    const urg = plan.urgentes || [];
    if (urg.length) {
      h += '<div class="apartado">Urgente · ' + urg.length + "</div>";
      for (const u of urg)
        h += (u.url ? '<a class="urgente" href="' + esc(u.url) + '" target="_blank" rel="noopener">'
                    : '<div class="urgente">') +
             '<span class="p"></span><span class="n">' + esc(u.titulo) + "</span>" +
             (u.url ? "</a>" : "</div>");
    }

    // EL RESTO DEL DIA. Antes solo salian el foco y las tres urgentes, y el operador lo dijo:
    // "tan solo sale en trabajo y no hoy". El plan del cockpit trae ademas los DMs, los leads y lo
    // que toca hoy, y eso es justo lo que se espera ver al abrir por la mañana.
    const resto = plan.resto || [];
    if (resto.length) {
      h += '<div class="apartado">También hoy<span style="flex:1"></span>' +
           '<span style="color:var(--apagado)">' + resto.length + "</span></div>";
      for (const r of resto)
        h += (r.url ? '<a class="ficha" href="' + esc(r.url) + '" target="_blank" rel="noopener" ' +
                      'style="text-decoration:none;color:inherit">' : '<div class="ficha">') +
             '<span style="width:3px;height:14px;border-radius:2px;flex:0 0 auto;background:' +
             (r.severidad === "warn" ? "var(--ambar)" : "var(--linea-fuerte)") + '"></span>' +
             "<span>" + esc(r.titulo) + "</span>" + (r.url ? "</a>" : "</div>");
    }

    if (!plan.foco && !urg.length && !resto.length && !(d.fallos || []).length)
      h += '<div class="vacio">Nada urgente hoy.<br>Lo que espera tu OK está en Trabajo.</div>';

    c.innerHTML = h + '<div id="caja-avisos"></div>';
    pintaAvisos();
  } catch (e) {
    c.innerHTML = '<div class="aviso-fallo">' + esc(e.message) + "</div>";
  }
}

// ---------------------------------------------------------------- que Zeno avise al movil
//
// Web Push: llega con la aplicacion cerrada. En iOS hace falta tenerla INSTALADA en la pantalla de
// inicio; una pestaña de Safari no recibe avisos y el navegador ni siquiera ofrece el permiso, asi
// que eso se dice en vez de enseñar un boton que no puede funcionar.

function base64AArray(b64) {
  const relleno = "=".repeat((4 - (b64.length % 4)) % 4);
  const limpio = (b64 + relleno).replace(/-/g, "+").replace(/_/g, "/");
  const crudo = atob(limpio);
  return Uint8Array.from([...crudo].map(c => c.charCodeAt(0)));
}

async function pintaAvisos() {
  const caja = $("#caja-avisos");
  if (!caja) return;
  let e;
  try { e = await api("/api/avisos"); } catch { return; }

  const puede = "serviceWorker" in navigator && "PushManager" in window;
  const instalada = window.matchMedia("(display-mode: standalone)").matches ||
                    window.navigator.standalone === true;
  const esIOS = /iPad|iPhone|iPod/.test(navigator.userAgent);

  let texto, boton = "";
  if (!e.posible) {
    texto = "faltan las claves en el servidor";
  } else if (!puede) {
    texto = esIOS && !instalada
      ? "añade Zeno a la pantalla de inicio y vuelve aquí"
      : "este navegador no puede recibirlos";
  } else if (Notification.permission === "denied") {
    texto = "los has bloqueado en los ajustes del navegador";
  } else if (e.suscritos > 0) {
    texto = "activos en " + e.suscritos + (e.suscritos === 1 ? " sitio" : " sitios");
    // QUITAR tiene que estar. El endpoint existia desde el primer dia y no habia forma de
    // llamarlo desde el movil: unos avisos que se activan y no se apagan acaban silenciados en
    // los ajustes del sistema, y entonces no vuelven a sonar nunca, ni los que importan.
    boton = '<button class="b sin" id="avisos-probar">Probar</button>' +
            '<button class="b sin" id="avisos-off">Quitar</button>';
  } else {
    texto = "solo lo urgente y lo que empeora, cinco al día como mucho";
    boton = '<button class="b primaria" id="avisos-on">Activar</button>';
  }

  caja.innerHTML = '<div class="avisos"><div class="c"><b>Avisos al móvil</b><span>' +
                   esc(texto) + "</span></div>" + boton + "</div>";
  const on = $("#avisos-on");
  if (on) on.onclick = () => activaAvisos(on, e.llave);
  const probar = $("#avisos-probar");
  if (probar) probar.onclick = async () => {
    probar.disabled = true; probar.textContent = "mandando…";
    try {
      const r = await api("/api/avisos/probar", { method: "POST" });
      probar.textContent = r.enviados ? "enviado" : "no ha salido";
    } catch (err) { probar.textContent = "falló"; }
  };
  const off = $("#avisos-off");
  if (off) off.onclick = async () => {
    off.disabled = true; off.textContent = "quitando…";
    try {
      // Se quita en los DOS sitios: en el servidor, para que deje de mandarlos, y la suscripcion
      // del navegador. Solo lo primero deja al navegador suscrito a algo que ya no existe.
      const reg = await navigator.serviceWorker.getRegistration();
      const sus = reg && await reg.pushManager.getSubscription();
      if (sus) {
        await api("/api/avisos/quitar", { method: "POST",
                                          body: JSON.stringify(sus.toJSON()) });
        await sus.unsubscribe();
      }
      pintaAvisos();
    } catch (err) { off.disabled = false; off.textContent = "no he podido"; }
  };
  pintaLaCara();
  pintaMemoria();
}

// El Face ID dado de alta, con su baja. UNA credencial que se puede dar de alta y no de baja es

async function pintaLaCara() {

// LO QUE ZENO RECUERDA, con su fecha y su boton de borrar.
//
// Esta pantalla es la CONDICION para que la memoria exista, no un extra. Una memoria que no se
// puede mirar acaba repitiendo como cierto algo que caduco hace semanas, y el operador no tiene
// forma de saber de donde salio. Por eso cada apunte lleva cuando se apunto y si lo dijo el o
// salio de una accion.
async function pintaMemoria() {
  const caja = $("#caja-avisos");
  if (!caja) return;
  let e;
  try { e = await api("/api/memoria"); } catch { return; }
  const apuntes = e.apuntes || [];

  const bloque = document.createElement("div");
  bloque.className = "avisos";
  bloque.style.marginTop = "10px";
  bloque.style.flexDirection = "column";
  bloque.style.alignItems = "stretch";

  let h = '<div class="c" style="display:flex;align-items:center;gap:8px">' +
          "<b style=\"flex:1\">Lo que recuerdo</b>" +
          (apuntes.length
            ? '<span style="color:var(--gris);font-size:11.5px">' + apuntes.length + "</span>"
            : "") + "</div>";
  h += '<span style="color:var(--gris);font-size:11.5px;line-height:1.35;display:block">' +
       (apuntes.length
         ? "solo lo que me has pedido apuntar. Dime “recuerda que…” en el chat"
         : "dime “recuerda que…” en el chat y lo apunto aquí") + "</span>";

  if (apuntes.length) {
    h += '<div id="lista-memoria" style="margin-top:8px;display:flex;flex-direction:column;gap:6px">';
    for (const a of apuntes)
      h += '<div class="ficha" style="align-items:flex-start;gap:8px">' +
           '<span style="flex:1;min-width:0">' + esc(a.texto) +
           '<span style="display:block;color:var(--apagado);font-size:11px;margin-top:2px">' +
           cuando(a.cuando) + (a.origen === "dicho" ? "" : " · de una acción") + "</span></span>" +
           '<button class="b sin" data-olvidar="' + esc(a.id) +
           '" style="flex:0 0 auto;padding:4px 8px;font-size:11.5px">Borrar</button></div>';
    h += "</div>";
  }
  if (e.turnos)
    h += '<button class="b sin" id="hilo-borrar" style="margin-top:8px">' +
         "Empezar conversación de cero (" + e.turnos + " mensajes)</button>";

  bloque.innerHTML = h;
  caja.appendChild(bloque);

  for (const b of bloque.querySelectorAll("[data-olvidar]"))
    b.onclick = async () => {
      b.disabled = true; b.textContent = "…";
      try {
        await api("/api/memoria/" + encodeURIComponent(b.dataset.olvidar), { method: "DELETE" });
        pintaAvisos();
      } catch (err) { b.disabled = false; b.textContent = "no he podido"; }
    };
  const hb = bloque.querySelector("#hilo-borrar");
  if (hb) hb.onclick = async () => {
    // Se pregunta: borrar la conversacion no se deshace. No toca los apuntes, y eso se dice,
    // porque si no nadie se atreve a pulsarlo y el hilo viejo acaba ensuciando las respuestas.
    if (!confirm("¿Empezar de cero? Se borra lo hablado. Lo que te he pedido recordar se queda."))
      return;
    hb.disabled = true; hb.textContent = "borrando…";
    try {
      await api("/api/hilo", { method: "DELETE" });
      $("#burbujas").innerHTML = "";
      pintaAvisos();
    } catch (err) { hb.disabled = false; hb.textContent = "no he podido"; }
  };
}

async function activaAvisos(boton, llave) {
  boton.disabled = true; boton.textContent = "…";
  try {
    const permiso = await Notification.requestPermission();
    if (permiso !== "granted") { pintaAvisos(); return; }
    const reg = await navigator.serviceWorker.register("/sw.js");
    await navigator.serviceWorker.ready;
    // `userVisibleOnly` es obligatorio: el navegador no deja suscribirse para hacer cosas en
    // silencio, cada envio tiene que acabar en una notificacion que la persona ve.
    const sus = await reg.pushManager.subscribe({
      userVisibleOnly: true,
      applicationServerKey: base64AArray(llave),
    });
    await api("/api/avisos/suscribir", { method: "POST", body: JSON.stringify(sus.toJSON()) });
    pintaAvisos();
  } catch (e) {
    boton.disabled = false; boton.textContent = "Activar";
    alert("No se han podido activar: " + e.message);
  }
}

// ---------------------------------------------------------------- los dos negocios a la par
//
// Ninguna fuente nueva: son los datos con los que el chat ya contestaba. La diferencia es que
// mirarlos deja de costar una llamada a la API y una espera.
//
// Esta pestaña la quito el operador en la maqueta, con razon: entonces estaba vacia. Vuelve con las
// cifras dentro porque pidio "poder gestionar ambos negocios a la par".

function pintaNegocio(n) {
  // Una TIRA por negocio, no una ficha: cuatro cifras desnudas con los digitos alineados y el
  // color del negocio en el filo. Antes eran ocho cajitas grises que pesaban mas que lo que hay
  // que decidir justo debajo.
  let h = '<div class="negocio ' + (n.id === "gutlyn" ? "gutlyn" : "") + '">' +
          '<div style="display:flex;align-items:baseline;gap:8px;margin-bottom:10px">' +
          '<b style="font-size:13.5px">' + esc(n.nombre) + "</b><span style=\"flex:1\"></span>" +
          '<span style="color:var(--apagado);font-size:12px">' + (n.pendiente || 0) +
          " esperan</span></div>";
  for (const f of n.fallos || [])
    h += '<div class="aviso-fallo">' + esc(f) + "</div>";
  h += '<div class="cifras">';
  // Cuatro: las que caben de un vistazo en un movil. El resto vive en el cockpit y en Xrise, que
  // es donde se analiza; aqui solo hace falta saber si algo se ha torcido.
  for (const k of (n.kpis || []).slice(0, 4))
    h += '<div class="cifra"><div class="v" style="' +
         (k.alerta === "bad" ? "color:var(--rojo)" : "") +
         '">' + esc(k.v) + '</div><div class="k">' + esc(k.k) + "</div></div>";
  return h + "</div></div>";
}

async function cargaNegocios() {
  const c = $("#v-negocios");

// ---------------------------------------------------------------- correo y agenda
//
// Zeno ENSEÑA el correo, no lo trabaja: cada correo y cada cita es un enlace que abre en Gmail o en
// Calendar, que es donde el operador ya trabaja y donde puede responder. Con los permisos de hoy
// Zeno no podría responder ni archivar aunque el boton existiera.

function horaCorta(txt, todoElDia) {
  if (!txt) return "";
  const d = new Date(txt);
  if (isNaN(d)) return "";
  const hoy = new Date();
  const mismoDia = d.toDateString() === hoy.toDateString();
  if (todoElDia) return mismoDia ? "hoy" : d.toLocaleDateString("es-ES", { day: "numeric", month: "short" });
  const hora = d.toLocaleTimeString("es-ES", { hour: "2-digit", minute: "2-digit" });
  return mismoDia ? hora : d.toLocaleDateString("es-ES", { day: "numeric", month: "short" }) + " " + hora;
}

function soloNombre(de) {
  // "Gustavo <g@x.com>" -> "Gustavo". Si no hay nombre, se queda el correo, que ya identifica.
  const t = String(de || "").trim();
  const corte = t.indexOf("<");
  const nombre = corte > 0 ? t.slice(0, corte).trim() : t;
  return (nombre.replace(/^"|"$/g, "") || t).trim() || "(sin remitente)";
}

async function conectaCuenta(negocio, boton) {
  boton.disabled = true;
  boton.textContent = "abriendo Google…";
  try {
    const d = await api("/api/google/conectar?negocio=" + encodeURIComponent(negocio),
                        { method: "POST" });
    // Se navega en la MISMA pestaña: en una PWA instalada una ventana nueva se abre fuera de la
    // aplicacion y la vuelta de Google se queda en un Safari suelto.
    location.href = d.enlace;
  } catch (e) {
    boton.disabled = false;
    boton.textContent = "Conectar";
    alert(e.message);
