function pintaCuentas(cuentas, alias) {
  // Con todo en orden esto no ocupa sitio: queda una linea discreta al final. Pero hay DOS casos en
  // los que la tarjeta vuelve entera, porque son cosas que hay que ver:
  //   · La cuenta no esta conectada.
  //   · Esta conectada pero le FALTAN permisos, porque se abrio un tramo nuevo despues. Sin esto,
  //     la funcion nueva falla y no hay forma de saber que lo que toca es reconectar: el boton de
  //     quitar estaba escondido en una linea pequeña al final de la pantalla.
  const ojo = cuentas.filter(c => !c.conectada || (c.faltan || []).length);
  if (!ojo.length) return "";

  const NOMBRES = {
    "https://www.googleapis.com/auth/gmail.compose": "dejar borradores",
    "https://www.googleapis.com/auth/calendar.events": "crear y mover citas",
    "https://www.googleapis.com/auth/gmail.readonly": "leer el correo",
    "https://www.googleapis.com/auth/calendar.readonly": "ver la agenda",
  };

  let h = "";
  for (const c of ojo) {
    const faltan = c.faltan || [];
    const estado = !c.conectada
      ? (c.configurada ? "sin conectar" : "falta configurarla")
      : "le falta un permiso: " + faltan.map(x => NOMBRES[x] || x).join(", ");
    h += '<div class="cuenta"><span class="punto' + (c.conectada ? " si" : "") + '"></span>' +
         '<div class="c"><b>' + esc(c.cuenta) + "</b><span>" + esc(estado) + "</span></div>";
    if (c.configurada)
      h += '<button class="b primaria" data-conectar="' + esc(c.negocio) + '">' +
           (c.conectada ? "Reconectar" : "Conectar") + "</button>";
    h += "</div>";
  }
  return h;
}

function pintaPieDeCuentas(cuentas) {
  const dentro = cuentas.filter(c => c.conectada);
  if (!dentro.length) return "";
  return '<div class="pie-cuentas">' +
         dentro.map(c => esc(c.cuenta) + " · lectura y agenda " +
                    '<button class="quitar-cuenta" data-olvidar="' + esc(c.negocio) +
                    '">quitar</button>').join(" · ") + "</div>";
}

async function cargaPersonal() {
  const c = $("#v-personal");
  c.innerHTML = '<div class="cargando">cargando…</div>';
  let cuentas = [], alias = [], datos = { correos: [], agenda: [], fallos: [] };
  try {
    const r = await Promise.all([api("/api/google/cuentas"), api("/api/personal")]);
    cuentas = r[0].cuentas || [];
    alias = r[0].alias || [];
    datos = r[1];
  } catch (e) {
    c.innerHTML = '<div class="aviso-fallo">' + esc(e.message) + "</div>";
    return;
  }

  let html = pintaCuentas(cuentas, alias);
  // Los fallos van arriba y siempre, por lo mismo que en pendiente: una bandeja corta sin aviso se
  // lee como "tengo poco correo" cuando la verdad puede ser "falta una cuenta entera".
  for (const f of datos.fallos || [])
    html += '<div class="aviso-fallo">' + esc(f) + "</div>";

  if (!cuentas.some(x => x.conectada)) {
    html += '<div class="vacio">Conecta tu cuenta y aquí verás el correo sin leer' +
            "<br>y las citas de los próximos días.</div>";
    c.innerHTML = html;
    enchufaBotonesDeCuenta(c);
    return;
  }

  const agenda = datos.agenda || [];
  html += '<div class="apartado">Próximas citas · 14 días<span style="flex:1"></span>' +
          '<button id="nueva-cita" style="background:none;border:0;color:var(--ambar);' +
          'font-size:12.5px;cursor:pointer;font-family:inherit;padding:4px 0">+ nueva</button>' +
          '</div><div id="agenda-extra"></div>';
  if (!agenda.length) html += '<div class="vacio">nada en las próximas dos semanas</div>';
  for (const a of agenda) {
    html += '<div class="cita"><span class="h">' + esc(horaCorta(a.cuando, a.todo_el_dia)) +
            '</span><span class="d"><a href="' + esc(a.abrir) + '" target="_blank" rel="noopener" ' +
            'style="text-decoration:none;color:inherit"><b>' + esc(a.titulo) + "</b></a><span>" +
            esc(a.negocio) + (a.con && a.con.length ? " · " + a.con.length + " personas" : "") +
            "</span>";
    // Mover y cancelar, pequeños y en texto: lo grande es abrir la cita, que es lo que se hace
    // noventa veces de cada cien.
    if (a.id && !a.todo_el_dia)
      html += '<span class="acciones-cita">' +
              '<button data-mover="' + esc(a.id) + '">mover</button>' +
              '<button data-anular="' + esc(a.id) + '">cancelar</button></span>';
    html += "</span></div>";
  }

  correosEnPantalla = datos.correos || [];
  ocultosEnZeno = datos.ocultos || 0;
  // LOS NEGOCIOS QUE EXISTEN, no los que hoy tienen correo. Si GutLyn desapareciera los dias que
  // no tiene nada, el operador no sabria si es que no hay o que no se esta mirando. Salen de los
  // buzones conectados, que es donde estan declarados.
  negociosDelCorreo = [];
  for (const b of (datos.buzones || []))
    for (const n of (b.negocios || []))
      if (!negociosDelCorreo.includes(n)) negociosDelCorreo.push(n);
  if (!negociosDelCorreo.length) negociosDelCorreo = ["zenvrax"];
  html += '<div class="apartado">Sin leer · ' + correosEnPantalla.length + "</div>";
  html += '<div class="filtros" id="pestanas-correo"></div><div id="lista-correos"></div>';

  c.innerHTML = html + pintaPieDeCuentas(cuentas);
  enchufaBotonesDeCuenta(c);
  pintaCorreos();
  pintaAgendaExtra();
}

// ---------------------------------------------------------------- responder
//
// Zeno redacta y GUARDA EL BORRADOR EN TU GMAIL, que sigue siendo el boton grande: un borrador no
// sale de tu buzon y se edita donde ya trabajas.
//
// DESDE EL 28-sep TAMBIEN ENVIA, porque era el unico trabajo diario que empezaba en Zeno y
// terminaba fuera: la respuesta estaba escrita y habia que abrir Gmail solo para pulsar enviar.
// Enviar sale al mundo igual que publicar, asi que se trata igual: boton aparte y apagado, aviso
// de que no se deshace, y PIN.

let borradorVivo = null;

function abreBorrador(id) {
  const caja = $("#borrador");
  borradorVivo = { id };
  caja.innerHTML =
    '<div class="nueva"><input id="bor-intencion" autocomplete="off" ' +
    'placeholder="qué quieres contestar (opcional)">' +
    '<textarea id="bor-texto" rows="6" placeholder="escríbelo tú, o deja que lo escriba Zeno" ' +
    'style="width:100%;background:#0d0d10;border:1px solid var(--linea);border-radius:9px;' +
    'padding:11px;color:var(--texto);font-size:16px;margin-bottom:8px"></textarea>' +
    '<div class="btns"><button class="b" id="bor-escribe">Que lo escriba Zeno</button>' +
    '<button class="b primaria" id="bor-guarda">Guardar borrador</button>' +
    // ENVIAR NO ES EL BOTON GRANDE, y no por estetica: el borrador se deshace y esto no. Va en
    // secundario y al lado del que no hace dano, para que el dedo tenga que ir a buscarlo.
    '<button class="b" id="bor-envia">Enviar</button>' +
    '<button class="b sin" id="bor-nada">Dejarlo</button></div>' +
    '<div id="bor-aviso"></div></div>';
  caja.scrollIntoView({ block: "center" });
  $("#bor-nada").onclick = () => { borradorVivo = null; caja.innerHTML = ""; };
  $("#bor-escribe").onclick = () => escribeZeno();
  $("#bor-guarda").onclick = () => guardaBorrador();
  $("#bor-envia").onclick = () => enviaRespuesta();
}

async function escribeZeno() {
  const b = $("#bor-escribe");
  b.disabled = true; b.textContent = "escribiendo…";
  try {
    const r = await api("/api/correo/redactar", { method: "POST", body: JSON.stringify({
      id: borradorVivo.id, intencion: ($("#bor-intencion").value || "").trim() }) });
    $("#bor-texto").value = r.texto || "";
    // El coste va debajo y a la vista, como en el chat: es la unica parte de esto que gasta.
    $("#bor-aviso").innerHTML = '<div class="coste">$' + (r.coste_usd || 0).toFixed(4) +
                                " · " + esc(r.modelo) + " · revísalo antes de guardarlo</div>";
  } catch (e) {
    $("#bor-aviso").innerHTML = '<div class="aviso-fallo">' + esc(e.message) + "</div>";
  } finally {
    b.disabled = false; b.textContent = "Que lo escriba Zeno";
  }
}

async function guardaBorrador() {
  const texto = ($("#bor-texto").value || "").trim();
  if (!texto) { $("#bor-texto").focus(); return; }
  const b = $("#bor-guarda");
  b.disabled = true; b.textContent = "…";
  try {
    const p = await api("/api/correo/borrador", { method: "POST", body: JSON.stringify({
      id: borradorVivo.id, texto }) });
    // Se avisa y se pregunta, no se bloquea: alguna direccion asi sale de un buzon que si atiende
    // gente. Lo que no puede pasar es guardar el borrador sin que nadie se entere de que va a un
    // sitio donde no lo lee nadie.
    if (p.nadie_lo_lee &&
        !confirm("Ese correo viene de " + p.para + ", que parece una direccion automatica. " +
                 "¿Guardo el borrador igual?")) {
      b.disabled = false; b.textContent = "Guardar borrador";
      return;
    }
    const r = await api("/api/correo/borrador/confirmar", { method: "POST", body: JSON.stringify({
      vale: p.vale }) });
    borradorVivo = null;
    $("#borrador").innerHTML = '<div class="propuesta"><div class="q">Borrador guardado</div>' +
      '<div class="c">Para ' + esc(r.para) + ". No se ha enviado.</div>" +
      '<a class="b" href="' + esc(r.abrir) + '" target="_blank" rel="noopener">' +
      "Abrirlo en Gmail</a></div>";
  } catch (e) {
    b.disabled = false; b.textContent = "Guardar borrador";
    $("#bor-aviso").innerHTML = '<div class="aviso-fallo">' + esc(e.message) + "</div>";
  }
}

// Enviar de verdad. Tres cosas antes de que salga: se dice a quien va y que no se recoge, se
// avisa si la direccion parece automatica, y el servidor pide el PIN.
async function enviaRespuesta() {
  const texto = ($("#bor-texto").value || "").trim();
  if (!texto) { $("#bor-texto").focus(); return; }
  const b = $("#bor-envia");
  b.disabled = true; b.textContent = "…";
  let p;
  try {
    p = await api("/api/correo/borrador", { method: "POST", body: JSON.stringify({
      id: borradorVivo.id, texto }) });
  } catch (e) {
    b.disabled = false; b.textContent = "Enviar";
    $("#bor-aviso").innerHTML = '<div class="aviso-fallo">' + esc(e.message) + "</div>";
    return;
  }
  // SE DICE A QUIEN VA Y QUE NO SE DESHACE, con la direccion delante. La pregunta lleva el dato
  // que evita el error de verdad, que es mandarselo a quien no era.
  if (!confirm("Enviar a " + p.para + "\n\nSale ahora y no se puede recoger.")) {
    b.disabled = false; b.textContent = "Enviar";
    return;
  }
  if (p.nadie_lo_lee &&
      !confirm(p.para + " parece una dirección automática y puede que no lo lea nadie. " +
               "¿Lo mando igual?")) {
    b.disabled = false; b.textContent = "Enviar";
    return;
  }
  await mandaConPin(p.vale);
}

async function mandaConPin(vale) {
  const b = $("#bor-envia");
  try {
    const r = await fetch("/api/correo/enviar", {
      method: "POST",
      headers: { "Content-Type": "application/json", Authorization: "Bearer " + token },
      body: JSON.stringify({ vale }) });
    // 428 es "falta el PIN", no "sesion mala": se pide y se reintenta CON EL MISMO VALE. Volver a
    // prepararlo crearia un borrador nuevo en Gmail por cada intento.
    if (r.status === 428) {
      const pin = prompt("PIN para enviar el correo");
      if (!pin) { b.disabled = false; b.textContent = "Enviar"; return; }
      try {
        await api("/api/pin", { method: "POST", body: JSON.stringify({ pin }) });
      } catch (e) { b.disabled = false; b.textContent = "Enviar"; alert(e.message); return; }
      return mandaConPin(vale);
    }
    const d = await r.json().catch(() => ({}));
    if (!r.ok) throw new Error(d.detail || ("error " + r.status));
    borradorVivo = null;
    $("#borrador").innerHTML = '<div class="propuesta"><div class="q">Enviado</div>' +
      '<div class="c">A ' + esc(d.para) + ". Ya ha salido.</div>" +
      '<a class="b" href="' + esc(d.abrir) + '" target="_blank" rel="noopener">' +
      "Verlo en Enviados</a></div>";
  } catch (e) {
    b.disabled = false; b.textContent = "Enviar";
    // El mensaje del servidor se enseña TAL CUAL. Cuando dice que no se sabe si salio, esa frase
    // es la que evita que el operador lo mande dos veces al mismo cliente.
    $("#bor-aviso").innerHTML = '<div class="aviso-fallo">' + esc(e.message) + "</div>";
  }
}

// ---------------------------------------------------------------- mover y cancelar una cita
//
// Mismos dos tiempos que crear. Y con invitados pide el PIN, por lo mismo que publicar: cancelar
// les manda un correo diciendo que la reunion se ha anulado, y ese correo no se recoge.

async function cambiaCita(que, id) {
  const caja = $("#cita-propuesta");
  let cuerpo = { id };
  if (que === "mover") {
    const cuando = prompt("Nueva fecha y hora (por ejemplo 2026-10-09 11:00)");
    if (!cuando) return;
    // Se manda tal cual y lo entiende el servidor: aqui una fecha mal formada solo tiene que
    // producir un mensaje claro, no una cita movida a un sitio raro.
    cuerpo.desde = cuando.trim().replace(" ", "T");
  }
  try {
    const p = await api("/api/agenda/" + (que === "mover" ? "mover" : "cancelar"),
                        { method: "POST", body: JSON.stringify(cuerpo) });
    propuestaViva = p;
    let h = '<div class="propuesta"><div class="q">' +
            (que === "mover" ? "Mover: " : "Cancelar: ") + esc(p.titulo) + "</div>";
    if (p.antes) h += '<div class="c">de ' + esc(p.antes) + " a " + esc(p.cuando) + "</div>";
    else h += '<div class="c">' + esc(p.cuando || "") + "</div>";
    if (p.avisa_a_invitados)
      h += '<div class="ojo"><b>Se avisará por correo a ' + esc((p.con || []).join(", ")) +
           "</b>. Eso no se puede deshacer.</div>";
    h += '<div class="btns"><button class="b primaria" id="cita-cambiar">' +
         (que === "mover" ? "Mover" : "Cancelar la cita") +
         '</button><button class="b sin dejarlo">Dejarlo</button></div></div>';
    caja.innerHTML = h;
    caja.scrollIntoView({ block: "center" });
    caja.querySelector(".dejarlo").onclick = () => { propuestaViva = null; caja.innerHTML = ""; };
    $("#cita-cambiar").onclick = () => aplicaCambio();
  } catch (e) {
    caja.innerHTML = '<div class="aviso-fallo">' + esc(e.message) + "</div>";
  }
}

async function aplicaCambio() {
  if (!propuestaViva) return;
  const b = $("#cita-cambiar");
  const antes = b.textContent;
  b.disabled = true; b.textContent = "…";
  try {
    const r = await fetch("/api/agenda/cambio/confirmar", {
      method: "POST",
      headers: { "Content-Type": "application/json", Authorization: "Bearer " + token },
      body: JSON.stringify({ vale: propuestaViva.vale }) });
    if (r.status === 428) {
      b.disabled = false; b.textContent = antes;
      const pin = prompt("PIN: esta cita tiene invitados y les va a llegar un correo");
      if (!pin) return;
      try { await api("/api/pin", { method: "POST", body: JSON.stringify({ pin }) }); }
      catch (e) { alert(e.message); return; }
      return aplicaCambio();
    }
    const d = await r.json().catch(() => ({}));
    if (!r.ok) throw new Error(d.detail || ("error " + r.status));
    propuestaViva = null;
    $("#cita-propuesta").innerHTML = '<div class="propuesta"><div class="q">' +
      (d.que === "cancelar" ? "Cancelada: " : "Movida: ") + esc(d.titulo) + "</div>" +
      (d.cuando ? '<div class="c">' + esc(d.cuando) + "</div>" : "") + "</div>";
    cargaPersonal();
  } catch (e) {
    b.disabled = false; b.textContent = antes;
    $("#cita-propuesta").insertAdjacentHTML("beforeend",
      '<div class="aviso-fallo">' + esc(e.message) + "</div>");
  }
}

// ---------------------------------------------------------------- proponer una cita
//
// Dos tiempos, y es la decision del operador: Zeno busca el hueco y prepara la cita, pero NO existe
// hasta que se pulsa Crear. Una cita con invitados manda un correo que no se puede recoger.

async function pintaAgendaExtra() {

    '<div class="nueva" id="caja-nueva-cita" hidden>' +

    '<input id="cita-con" placeholder="invitados, separados por coma (opcional)" ' +

async function buscaHuecos() {
  const caja = $("#cita-huecos");
  const min = Math.max(10, parseInt($("#cita-min").value, 10) || 30);
  caja.innerHTML = '<div class="cargando">buscando…</div>';
  try {
    const d = await api("/api/agenda/huecos?minutos=" + min + "&dias=10");
    const hs = d.huecos || [];
    if (!hs.length) { caja.innerHTML = '<div class="vacio">no hay huecos de ' + min + " min</div>"; return; }
    let h = '<div class="filtros">';
    for (const x of hs)
      h += '<button class="filtro" data-desde="' + esc(x.desde) + '" data-min="' + min + '">' +
           esc(x.etiqueta) + "</button>";
    caja.innerHTML = h + "</div>";
    caja.querySelectorAll("[data-desde]").forEach(b =>
      b.onclick = () => proponeCita(b.dataset.desde, parseInt(b.dataset.min, 10)));
  } catch (e) {
    caja.innerHTML = '<div class="aviso-fallo">' + esc(e.message) + "</div>";
  }
}

async function proponeCita(desde, minutos) {
  const titulo = ($("#cita-titulo").value || "").trim();
  if (!titulo) { $("#cita-titulo").focus(); return; }
  const caja = $("#cita-propuesta");
  try {
    // Los invitados se mandan como los ha escrito el operador; limpiarlos y comprobar que son
    // correos lo hace el servidor, porque es lo que decide si SALE una invitacion.
    const con = ($("#cita-con").value || "").split(",").map(x => x.trim()).filter(Boolean);
    const p = await api("/api/agenda/proponer", { method: "POST", body: JSON.stringify(
      { titulo: titulo, desde: desde, minutos: minutos, con: con }) });
    propuestaViva = p;
    let h = '<div class="propuesta"><div class="q">' + esc(p.titulo) + "</div>" +
            '<div class="c">' + esc(p.cuando) + "</div>";
    // Lo que no se deshace se dice ANTES de confirmar, no despues.
    if (p.avisa_a_invitados)
      h += '<div class="ojo"><b>Se enviará invitación por correo a ' +
           esc((p.con || []).join(", ")) + "</b>. Eso no se puede deshacer.</div>";
    if ((p.choca_con || []).length)
      h += '<div class="ojo">Ojo: ya tienes algo en ese rato</div>';
    h += '<div class="btns"><button class="b primaria" id="cita-crear">Crear en el calendario' +
         '</button><button class="b sin dejarlo">Dejarlo</button></div></div>';
    caja.innerHTML = h;
    $("#cita-crear").onclick = creaCita;
    caja.querySelector(".dejarlo").onclick = () => { propuestaViva = null; caja.innerHTML = ""; };
  } catch (e) {
    caja.innerHTML = '<div class="aviso-fallo">' + esc(e.message) + "</div>";
  }
}

async function creaCita() {
  if (!propuestaViva) return;
  const b = $("#cita-crear");
  b.disabled = true; b.textContent = "creando…";
  try {
    const r = await api("/api/agenda/confirmar", { method: "POST", body: JSON.stringify(
      { vale: propuestaViva.vale }) });
    propuestaViva = null;
    $("#cita-propuesta").innerHTML =
      '<div class="propuesta"><div class="q">Creada: ' + esc(r.titulo) + "</div>" +
      '<div class="c">' + esc(r.cuando) + "</div>" +
      (r.abrir ? '<a class="b" href="' + esc(r.abrir) + '" target="_blank" rel="noopener">' +
                 "Verla en el calendario</a>" : "") + "</div>";
    $("#cita-titulo").value = "";
    $("#cita-con").value = "";
    cargaPersonal();
  } catch (e) {
    b.disabled = false; b.textContent = "Crear en el calendario";
    $("#cita-propuesta").insertAdjacentHTML("beforeend",
      '<div class="aviso-fallo">' + esc(e.message) + "</div>");
  }
}

// Se guardan aparte para poder filtrar sin volver a pedirlos a Google: cada lectura son varias
// llamadas a Gmail, y filtrar es una pregunta sobre lo que ya se tiene delante.
let correosEnPantalla = [];
//: Que cuentas existen en el correo y cual se esta viendo. La eleccion se respeta mientras la
//: aplicacion siga abierta: al recargar vuelve a abrirse la que tenga correo.
let negociosDelCorreo = [];
let cuentaVista = "";
//: Cuantos correos se estan escondiendo en Zeno ahora mismo. Lo dice el servidor al cargar y sube
//: al quitar uno, para que el deshacer aparezca sin tener que recargar nada.
let ocultosEnZeno = 0;

// UN GRUPO POR NEGOCIO, plegable (2026-09-29). El operador: *"los email, puedes tener un
// desplegable por Zenvrax y otro por GutLyn? O separarlos de alguna manera"*.
//
// Antes habia un FILTRO (botones "Todos / zenvrax / gutlyn") que se escondia solo cuando habia un
// unico negocio, y se escondia SIEMPRE: el correo de GutLyn llega al mismo buzon como alias, y la
// consulta traia los doce mas recientes, que eran todos de Zenvrax. Arreglado en el servidor
// (cada negocio pide los suyos), aqui se pasa a grupos: con un filtro hay que tocar para ver lo
// del otro negocio, y con grupos se ven los dos de un vistazo.
//
// Y UN NEGOCIO SIN CORREO NO DESAPARECE: sale su cabecera diciendo que esta limpio. Si se cayera
// de la pantalla, no se sabria si es que no hay nada o que no se esta mirando, que es de donde
// venimos.
// UN BOTON POR CUENTA, y al pulsarlo salen los suyos. Segunda vuelta del mismo dia: primero
// fueron grupos plegables y el operador lo prefirio asi, *"botones separados que cada vez que se
// cliclen salgan los de la cuenta"*.
//
// Con dos cuentas y el movil en la mano, las pestañas ganan: se ve de un toque lo de una o lo de
// la otra, sin desplazarse por la lista de la primera para llegar a la segunda.
//
// LOS BOTONES SALEN DE LAS CUENTAS CONECTADAS, no de los correos que hayan llegado hoy. Si el de
// GutLyn desapareciera los dias sin correo, no se sabria si es que no hay nada o que no se esta
// mirando, que es la duda de la que salio todo esto. Por eso el boton se queda con su cero.
function pintaCorreos() {
  const caja = $("#lista-correos"), cajaP = $("#pestanas-correo");
  if (!caja) return;

  const cuantos = {};
  for (const m of correosEnPantalla) cuantos[m.negocio] = (cuantos[m.negocio] || 0) + 1;
  // El dueño del buzon primero y el resto detras: es el orden en que llegan de `buzones`.
  const cuentas = negociosDelCorreo.length ? negociosDelCorreo : Object.keys(cuantos).sort();

  // La primera vez se abre la que TIENE correo, no siempre la primera: entrar en una pestaña
  // vacia teniendo la otra llena es empezar con un paso de mas.
  if (!cuentaVista || !cuentas.includes(cuentaVista))
    cuentaVista = cuentas.find(n => cuantos[n]) || cuentas[0];

  if (cajaP) {
    // Con una sola cuenta no hay nada entre lo que elegir: la fila se esconde en vez de ocupar
    // sitio en la pantalla que mas se mira.
    cajaP.innerHTML = cuentas.length < 2 ? "" : cuentas.map(n =>
      '<button class="filtro' + (cuentaVista === n ? " on" : "") + '" data-cuenta="' + esc(n) +
      '">' + esc(n) + " <b>" + (cuantos[n] || 0) + "</b></button>").join("");
    cajaP.querySelectorAll("[data-cuenta]").forEach(b => b.onclick = () => {
      cuentaVista = b.dataset.cuenta;
      pintaCorreos();
    });
  }

  const suyos = cuentas.length < 2
    ? correosEnPantalla
    : correosEnPantalla.filter(m => m.negocio === cuentaVista);
  caja.innerHTML = (suyos.length
    ? pintaLosCorreos(suyos)
    : '<div class="vacio">' + (correosEnPantalla.length
        ? "nada sin leer de " + esc(cuentaVista) : "bandeja limpia") + "</div>")
    // EL DESHACER TIENE QUE VERSE. Sin esto, un toque por error esconde un correo para siempre y
    // el unico camino de vuelta es abrir Gmail, que es de lo que veniamos huyendo.
    + (ocultosEnZeno
        ? '<button class="b sin" id="ver-ocultos" style="margin-top:10px">' + ocultosEnZeno +
          (ocultosEnZeno === 1 ? " quitado · devolverlo" : " quitados · devolverlos") + "</button>"
        : "");
  enchufaCorreos(caja);
  const vo = $("#ver-ocultos");
  if (vo) vo.onclick = async () => {
    vo.disabled = true; vo.textContent = "…";
    try {
      await api("/api/correo/mostrar", { method: "POST" });
      ocultosEnZeno = 0;
      cargaPersonal();        // aqui SI se recarga: los correos que vuelven hay que ir a buscarlos
    } catch (e) { vo.disabled = false; vo.textContent = "no he podido"; }
  };
}


function pintaLosCorreos(lista) {
  let h = "";
  for (const m of lista) {
    h += '<div class="correo">' +
         '<a href="' + esc(m.abrir) + '" target="_blank" rel="noopener" ' +
         'style="text-decoration:none;color:inherit;display:block">' +
         '<span class="de"><b>' + esc(soloNombre(m.de)) + "</b><i>" + esc(m.negocio) + " · " +
         esc(horaCorta(m.fecha)) + "</i></span>" +
         '<div class="as">' + esc(m.asunto) + "</div>" +
         '<div class="re">' + esc(m.resumen) + "</div></a>";
    if (m.id)
      // "Quitar" esconde el correo SOLO en Zeno: sigue en Gmail, sin leer y sin enterarse. El
      // operador (29-sep): *"lo unico es no verlo en Zeno, aun cuando siga en Gmail"*. Va en texto
      // pequeño y al lado de responder, no como boton grande: es limpieza, no una decision.
      h += '<span class="acciones-cita"><button data-responder="' + esc(m.id) +
           '">responder</button><button data-ocultar="' + esc(m.id) +
           '">quitar</button></span>';
    h += "</div>";
  }
  return h;
}

// ---------------------------------------------------------------- tirar para actualizar
//
// El operador: *"coloca actualizar al bajarlo para no tener que salir de la aplicacion"*. En una
// PWA instalada no hay barra del navegador, asi que sin esto la unica forma de recargar es cerrarla
// y volver a abrirla.
//
// Solo se activa si la lista YA esta arriba del todo (`scrollTop <= 0`): si no, cualquier scroll
// hacia arriba dispararia una recarga a mitad de lectura.
const UMBRAL = 70;          // lo que hay que tirar para que cuente. Menos, y se recarga sin querer
const TOPE = 110;           // hasta donde acompaña el indicador, para que el gesto tenga fin
let inicioY = null, tirando = false;

function alturaTiron(px, texto, clase) {
  const t = $("#tiron");
  t.style.height = px + "px";
  $("#tiron-texto").textContent = texto;
  t.className = clase;
}

function recargaVista() {
  const actual = document.querySelector(".pie button.on")?.dataset.vista || "hoy";
  // Al tirar para actualizar NO se vuelve a narrar: el texto ya esta escrito y pagado para hoy.
  if (actual === "hoy") return cargaHoy();
  if (actual === "personal") return cargaPersonal();
  cargaNegocios();
  return cargaPendientes();
}

const zona = document.querySelector("main");

zona.addEventListener("touchstart", (e) => {
  inicioY = zona.scrollTop <= 0 ? e.touches[0].clientY : null;
  tirando = false;
}, { passive: true });

zona.addEventListener("touchmove", (e) => {
  if (inicioY === null) return;
  const avance = e.touches[0].clientY - inicioY;
  if (avance <= 0) { if (tirando) { alturaTiron(0, "", ""); tirando = false; } return; }
  tirando = true;
  // La resistencia (dividir entre 2) es lo que hace que el gesto se sienta fisico en vez de
  // pegajoso: el dedo avanza mas que el indicador.
  const alto = Math.min(avance / 2, TOPE);
  alturaTiron(alto, alto >= UMBRAL ? "suelta para actualizar" : "tira para actualizar",
              alto >= UMBRAL ? "listo" : "");
}, { passive: true });

zona.addEventListener("touchend", async () => {
  if (inicioY === null || !tirando) { inicioY = null; return; }
  const alto = parseInt($("#tiron").style.height || "0", 10);
  inicioY = null; tirando = false;
  if (alto < UMBRAL) { alturaTiron(0, "", ""); return; }
  alturaTiron(34, "actualizando", "girando");
  try { await recargaVista(); } finally { alturaTiron(0, "", ""); }
});

// ------------------------------------------------------------------ entrar con Face ID
//
// POR QUE. El operador: *"con el Face ID fuera mas que suficiente y no te estuviera pidiendo
// codigo o contraseña cada vez"*. Medido: el token dura 90 dias y su firma no cambia al reiniciar
// el servicio, asi que no lo echaba el servidor. Lo que se pierde es el almacenamiento del
// navegador, que iOS limpia. Una passkey NO vive ahi: vive en el llavero, sobrevive a esa
// limpieza y viaja a los demas dispositivos de la cuenta. Por eso esto lo arregla de raiz y
// guardar la clave "mas tiempo" no lo habria arreglado.
//
// La cara nunca sale del telefono. El movil comprueba que eres tu y solo entonces firma con una
// clave privada que tampoco sale de su chip; aqui viaja la firma, que el servidor comprueba.

const hayCara = !!(window.PublicKeyCredential && navigator.credentials);

// El navegador habla en binario y la API en texto. Estas dos hacen la traduccion, y se escriben a
// mano a proposito: es una docena de lineas y evita una dependencia mas en la puerta de entrada.
const aBytes = (s) => Uint8Array.from(atob(String(s).replace(/-/g, "+").replace(/_/g, "/")
                     .padEnd(String(s).length + (4 - String(s).length % 4) % 4, "=")),
                     c => c.charCodeAt(0));
const aTexto = (b) => btoa(String.fromCharCode(...new Uint8Array(b)))
                      .replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, "");

function preparaAlta(o) {
  return { ...o, challenge: aBytes(o.challenge),
           user: { ...o.user, id: aBytes(o.user.id) },
           excludeCredentials: (o.excludeCredentials || []).map(c => ({ ...c, id: aBytes(c.id) })) };
}
function preparaEntrada(o) {
  return { ...o, challenge: aBytes(o.challenge),
           allowCredentials: (o.allowCredentials || []).map(c => ({ ...c, id: aBytes(c.id) })) };
}
function empaqueta(c) {
  const r = c.response;
  const fuera = { id: c.id, rawId: aTexto(c.rawId), type: c.type,
                  response: { clientDataJSON: aTexto(r.clientDataJSON) } };
  if (r.attestationObject) fuera.response.attestationObject = aTexto(r.attestationObject);
  if (r.authenticatorData) fuera.response.authenticatorData = aTexto(r.authenticatorData);
  if (r.signature) fuera.response.signature = aTexto(r.signature);
  if (r.userHandle) fuera.response.userHandle = aTexto(r.userHandle);
  return fuera;
}

async function entrarConCara() {
  const e = $("#error-login");
  e.textContent = "";
  try {
    const opciones = await api("/api/rostro/entrar");
    const c = await navigator.credentials.get({ publicKey: preparaEntrada(opciones) });
    const r = await api("/api/rostro/entrar", { method: "POST",
                                                body: JSON.stringify({ respuesta: empaqueta(c) }) });
    dentro(r.token);
  } catch (err) {
    // Que el operador cancele el Face ID NO es un error que haya que enseñar en rojo: es que ha
    // cambiado de idea, y lo que toca es dejarle la clave delante.
    if (err && (err.name === "NotAllowedError" || err.name === "AbortError")) return;
    e.textContent = err.message || "no he podido entrar con Face ID";
  }
}

async function darDeAltaLaCara() {
  try {
    const opciones = await api("/api/rostro/alta");
    const c = await navigator.credentials.create({ publicKey: preparaAlta(opciones) });
    const r = await api("/api/rostro/alta", {
      method: "POST",
      body: JSON.stringify({ respuesta: empaqueta(c),
                             apodo: /iPhone|iPad|Android/.exec(navigator.userAgent)?.[0] || "" }) });
    return r;
  } catch (err) {
    if (err && (err.name === "NotAllowedError" || err.name === "AbortError")) return null;
    throw err;
  }
}

// ------------------------------------------------------------------ dictado (hablar en vez de escribir)
//
// Lo pidio el operador: en el movil, con una mano, escribir una pregunta larga es justo lo que
// hace que no se pregunte. Va en los dos sitios donde se escribe: buscar y preguntar.
//
// SE USA EL RECONOCIMIENTO DEL PROPIO NAVEGADOR y no una API de transcripcion. Dos razones, y la
// segunda pesa mas que la primera:
//   · No cuesta nada y no hace falta una clave nueva. Una API de voz se paga por minuto.
//   · La voz no sale de donde ya esta. Mandar el audio a un tercero para transcribirlo es un
//     proveedor mas con el que hablas de tus clientes, y eso se decide aparte, no de rebote.
//
// No lo tienen todos los navegadores (Firefox no). Cuando no esta, el boton NO se enseña: un
// boton que no puede funcionar es peor que no tenerlo.
const Voz = (() => {
  const Motor = window.SpeechRecognition || window.webkitSpeechRecognition;
  let viva = null;                       // la sesion en curso, si la hay
  return {
    hay: !!Motor,
    escuchando: () => !!viva,
    para() { if (viva) { const v = viva; viva = null; try { v.stop(); } catch {} } },
    // `alOir` recibe lo que se lleva oido y si es ya definitivo. `alAcabar` recibe el texto final
    // o un mensaje de error, que NO es lo mismo que cadena vacia: callarse y fallar se ven igual
    // desde fuera y hay que distinguirlos.
    arranca(alOir, alAcabar) {
      if (!Motor) { alAcabar("", "este navegador no sabe escuchar"); return; }
      if (viva) { this.para(); return; }
      const r = new Motor();
      r.lang = "es-ES";
      r.interimResults = true;           // se va viendo mientras hablas: sin esto parece colgado
      r.continuous = false;              // una frase y para. Un microfono abierto se olvida abierto
      r.maxAlternatives = 1;
      let dicho = "", fallo = "";
      r.onresult = (e) => {
        let listo = "", enCurso = "";
        for (let i = e.resultIndex; i < e.results.length; i++) {
          const trozo = e.results[i][0].transcript;
          if (e.results[i].isFinal) listo += trozo; else enCurso += trozo;
        }
        if (listo) dicho += listo;
        alOir((dicho + enCurso).trim(), !enCurso);
      };
      r.onerror = (e) => {
        // Se traduce a algo que se pueda leer: "not-allowed" en pantalla no dice que hacer.
        fallo = { "not-allowed": "no has dado permiso al micrófono",
                  "service-not-allowed": "el navegador no deja usar el micrófono aquí",
                  "no-speech": "no he oído nada",
                  "audio-capture": "no encuentro ningún micrófono",
                  "network": "sin red para transcribir" }[e.error] || ("no he podido escuchar: " + e.error);
      };
      r.onend = () => { viva = null; alAcabar(dicho.trim(), fallo); };
      viva = r;
      try { r.start(); } catch (e) { viva = null; alAcabar("", "no he podido abrir el micrófono"); }
    },
  };
})();

// Engancha un boton de microfono a un campo. `alTerminar` se llama con el texto ya puesto en el
// campo, para que buscar pueda lanzar la busqueda y el chat pueda NO enviar nada solo.
function enchufaVoz(idBoton, idCampo, idDice, alTerminar) {
  const b = $(idBoton), campo = $(idCampo), dice = $(idDice);
  if (!b) return;
  // El boton solo existe si el navegador sabe escuchar.
  b.hidden = !Voz.hay;
  if (!Voz.hay) return;
  b.onclick = () => {
    if (Voz.escuchando()) { Voz.para(); return; }
    b.classList.add("oyendo");
    dice.textContent = "escuchando…";
    Voz.arranca(
      (texto) => { dice.textContent = texto || "escuchando…"; },
      (texto, fallo) => {
        b.classList.remove("oyendo");
        dice.textContent = fallo || "";
        if (fallo) { setTimeout(() => { if (dice.textContent === fallo) dice.textContent = ""; }, 4000); return; }
        if (!texto) return;
        // Se AÑADE a lo que hubiera, no se pisa: puedes escribir media frase y dictar el resto.
        campo.value = (campo.value.trim() ? campo.value.trim() + " " : "") + texto;
        campo.focus();
        if (alTerminar) alTerminar(campo.value);
      });
  };
}

enchufaVoz("#mic-q", "#q", "#dice-q", () => { $("#limpiar").hidden = false; busca(); });

// ------------------------------------------------------------------ Zeno contesta hablando
//
// Solo si le has hablado: si escribes, contesta escrito. La conversacion mantiene el canal por el
// que empezo, que es lo que uno espera y lo que evita que se ponga a hablar en una reunion.
//
// Tambien del navegador, como el escuchar: ni coste ni clave ni audio saliendo a ningun sitio.
const Habla = (() => {
  const S = window.speechSynthesis;
  return {
    hay: !!S,
    calla() { try { S && S.cancel(); } catch {} },
    di(texto) {
      return new Promise((listo) => {
        if (!S || !texto) { listo(); return; }
        let acabado = false;
        const fin = () => { if (!acabado) { acabado = true; listo(); } };
        try {
          S.cancel();
          const u = new SpeechSynthesisUtterance(texto);
          u.lang = "es-ES";
          u.rate = 1.05;
          u.onend = fin;
          u.onerror = fin;
          S.speak(u);
          // RED DE SEGURIDAD. `onend` no siempre llega (pasa en iOS al bloquear la pantalla y en
          // textos largos), y sin esto la conversacion se queda esperando para siempre a algo que
          // ya termino. Se calcula por el largo del texto, con un minimo y un tope.
          setTimeout(fin, Math.min(30000, 2500 + texto.length * 90));
        } catch (e) { fin(); }
      });
    },
  };
})();

// ------------------------------------------------------------------ conversacion de voz
//
// Pulsas una vez y se habla: escucha, contesta en alto y vuelve a escuchar hasta que pulsas otra
// vez. Es lo que hace que sirva andando o conduciendo, que es cuando no se puede teclear.
//
// EL ORDEN IMPORTA Y NO ES CASUAL. Lo dicho va PRIMERO a /api/orden, que empareja con reglas y no
// cuesta nada. Solo si no era una orden se manda al chat, que si gasta. Asi cerrar una tarea
// hablando sale gratis y el tope diario de preguntas se queda para preguntar.
let conversando = false;

function oye(dice) {
  return new Promise((listo) => {
    Voz.arranca((t) => { dice.textContent = t || "escuchando…"; },
                (texto, fallo) => listo({ texto, fallo }));
  });
}

async function conversa() {
  const b = $("#mic-pregunta"), dice = $("#dice-pregunta");
  if (conversando) { conversando = false; Voz.para(); Habla.calla(); return; }
  conversando = true;
  try {
    while (conversando) {
      b.classList.add("oyendo");
      const oido = await oye(dice);
      b.classList.remove("oyendo");
      dice.textContent = "";
      if (!conversando) break;
      if (oido.fallo) { dice.textContent = oido.fallo; await Habla.di(oido.fallo); break; }
      if (!oido.texto) break;                  // silencio: se acaba la conversacion, no se insiste
      burbuja("tu", oido.texto);

      const o = await api("/api/orden", { method: "POST",
                                          body: JSON.stringify({ frase: oido.texto }) });
      if (o.estado === "vale") {
        burbuja("el", o.decir);
        await Habla.di(o.decir);
        if (!conversando) break;
        b.classList.add("oyendo");
        const r = await oye(dice);
        b.classList.remove("oyendo");
        dice.textContent = "";
        burbuja("tu", r.texto || "(no he oído nada)");
        // Quien decide si eso fue un si es el SERVIDOR, que es donde estan la regla y sus tests.
        // Repetirla aqui en JavaScript seria tener dos reglas que se separan a la primera.
        const q = await api("/api/orden", { method: "POST",
                                            body: JSON.stringify({ frase: r.texto || "",
                                                                   vale: o.vale }) });
        if (q.estado === "si") {
          try {
            const hecho = await api("/api/accion/confirmar", { method: "POST",
                                                               body: JSON.stringify({ vale: o.vale }) });
            const f = hecho.hecho ? "hecho" : "no he podido: " + (hecho.detalle || "");
            burbuja("el", f); await Habla.di(f);
            cargaPendientes();                 // la lista se recarga: lo cerrado desaparece
          } catch (e) { burbuja("el", e.message); await Habla.di(e.message); }
        } else {
          burbuja("el", "vale, lo dejo"); await Habla.di("vale, lo dejo");
        }
        continue;
      }
      if (o.estado !== "no_es_orden") {
        burbuja("el", o.decir); await Habla.di(o.decir);
        continue;
      }
      // No era una orden: es una pregunta, y preguntar cuesta.
      const respuesta = await preguntar(oido.texto);
      if (respuesta) await Habla.di(respuesta);
    }
  } finally {
    conversando = false;
    b.classList.remove("oyendo");
    dice.textContent = "";
  }
}

if (Voz.hay) {

// ------------------------------------------------------------------ abrir sin volver a entrar
//
// EL CASO (2026-09-29). El operador: *"una vez que le doy a abrir desde su plataforma... me envia a
// internet y de ahi tengo que volver a validar la contrasena y todo, y no tiene mucho sentido"*.
//
// En el iPhone cada aplicacion instalada tiene su PROPIO almacen, separado de Safari. El cockpit
// guarda su sesion ahi dentro; este enlace se abre en otro almacen, donde no hay nada. Y saltar de
// una aplicacion instalada a otra no se puede en iOS.
//
// UN SOLO SITIO Y NO DIEZ. Esto se engancha a TODOS los enlaces de una vez, en lugar de cambiar
// los diez `<a href>` que hay repartidos por la pantalla. Asi tambien vale para los que se
// añadan mañana, que es donde se habria colado el primer olvido.
//
// SI ALGO FALLA SE ABRE EL DE SIEMPRE. El sistema caido, la clave retirada o una version vieja sin
// ese endpoint acaban en el enlace normal, que pedira la contrasena como hasta hoy. Lo que no
// puede pasar es que el operador se quede sin poder abrir lo que estaba mirando.
const CASAS = ["cockpit.zenvrax.com", "xrise.zenvrax.com"];

function esDeLasCasas(href) {
  try { return CASAS.includes(new URL(href, location.href).hostname); } catch { return false; }
}

document.addEventListener("click", async (ev) => {
  const a = ev.target && ev.target.closest && ev.target.closest("a[href]");
  if (!a || !esDeLasCasas(a.href)) return;
  // Si ya se esta pidiendo, se deja pasar: el segundo toque abre el de siempre en vez de quedarse
  // colgado. Un boton que no responde es peor que uno que pide la contrasena.
  if (a.dataset.abriendo === "1") return;
  ev.preventDefault();
  a.dataset.abriendo = "1";
  const antes = a.textContent;
  // La pestaña se abre ANTES de pedir el enlace, y con ella ya en la mano se cambia su direccion.
  // Abrirla despues del `await` haria que Safari la bloqueara: solo deja abrir pestañas como
  // respuesta directa a un toque, y para entonces el toque ya paso.
  const pestana = window.open("", "_blank", "noopener");
  try {
    const r = await api("/api/abrir", { method: "POST", body: JSON.stringify({ url: a.href }) });
    if (pestana) pestana.location.replace(r.url || a.href);
    else location.href = r.url || a.href;       // el navegador no dejo abrir pestaña: se va aqui
  } catch (e) {
    if (pestana) pestana.location.replace(a.href);
    else location.href = a.href;
  } finally {
    a.dataset.abriendo = "";
    if (antes !== undefined) a.textContent = antes;
  }
}, true);

$("#btn-chat").onclick = () => abreCapa("capa-chat");
document.addEventListener("click", (e) => {
  const f = e.target.closest("[data-cola]");
  if (f) abreCola(f.dataset.cola, f.querySelectorAll("span")[0].textContent);

$("#btn-buscar").onclick = () => abreCapa("capa-buscar");
document.querySelectorAll("[data-cerrar]").forEach(b =>
  b.onclick = () => { $("#" + b.dataset.cerrar).hidden = true; });

// Si ya había sesión, se entra directo. Si el token ya no vale, `api` hace salir() solo.
if (token) { cargaColasAbribles().then(() => dentro(token)); }
