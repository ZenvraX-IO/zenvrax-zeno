<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#101012">
<title>Zeno</title>
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/img/favicon.png">
<link rel="apple-touch-icon" href="/img/apple-touch-icon.png">
<style>
  :root{
    --negro:#101012; --carbon:#17171b; --linea:#26262c; --texto:#f2f2f4; --gris:#9a9aa4;
    --ambar:#f0a830; --ambar-suave:#3a2c12; --rojo:#e0574a;
    --arriba:env(safe-area-inset-top,0px); --abajo:env(safe-area-inset-bottom,0px);
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{background:var(--negro);color:var(--texto);
       font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
       display:flex;flex-direction:column}
  [hidden]{display:none!important}
  button{font:inherit}

  .barra{display:flex;align-items:center;gap:10px;padding:calc(14px + var(--arriba)) 16px 14px;
         border-bottom:1px solid var(--linea);position:sticky;top:0;background:var(--negro);z-index:5}
  .barra .t{font-weight:600;flex:1}
  .barra .salir{color:var(--gris);background:none;border:0;font-size:13px}
  .marca{width:26px;height:26px;border-radius:7px;background:var(--negro);border:1px solid var(--linea);
         position:relative;flex:0 0 auto}
  .marca i::before,.marca i::after{content:"";position:absolute;left:5px;right:5px;height:4px;background:#fff}
  .marca i::before{top:5px} .marca i::after{bottom:5px}
  .marca s{position:absolute;left:5px;right:5px;top:11px;height:4px;background:#fff;
           transform:rotate(-27deg)}
  .marca u{position:absolute;left:11px;top:9px;width:5px;height:5px;border-radius:50%;
           background:var(--ambar);z-index:2}

  main{flex:1;overflow-y:auto;padding:14px 16px 20px}
  .pie{display:flex;border-top:1px solid var(--linea);padding-bottom:var(--abajo);background:var(--negro)}
  .pie button{flex:1;background:none;border:0;color:var(--gris);padding:12px 0 14px;font-size:12px}
  .pie button.on{color:var(--ambar)}

  .aviso-fallo{background:#2a1a18;border:1px solid #50302a;color:#ffb3aa;border-radius:10px;
               padding:10px 12px;font-size:13px;margin-bottom:12px}
  .resumen{color:var(--gris);font-size:13px;margin-bottom:14px}
  .resumen b{color:var(--ambar)}
  .tarjeta{background:var(--carbon);border:1px solid var(--linea);border-radius:13px;
           padding:13px 14px;margin-bottom:12px}
  .neg{font-size:11px;letter-spacing:.8px;text-transform:uppercase;color:var(--gris);margin-bottom:7px}
  .neg.gutlyn{color:#b8a0e8}
  .post{font-weight:600;margin-bottom:5px;line-height:1.35}
  .extracto{color:var(--gris);font-size:13px;margin-bottom:11px;white-space:pre-wrap}
  .btns{display:flex;gap:7px;flex-wrap:wrap}
  .b{border:1px solid var(--linea);background:#1e1e24;color:var(--texto);border-radius:9px;
     padding:9px 12px;font-size:13px;display:inline-flex;align-items:center;gap:6px;
     text-decoration:none;cursor:pointer}
  .b.primaria{background:var(--ambar);color:#221a08;border-color:var(--ambar);font-weight:600}
  .b.gasta{border-color:#4a3a14;background:var(--ambar-suave)}
  .b.sin{border-style:dashed;color:var(--gris)}
  .marca-accion{font-size:10.5px;letter-spacing:.4px;text-transform:uppercase;padding:2px 6px;
                border-radius:5px}
  .m-mundo{background:#40201c;color:#ffb3aa}
  .m-cuesta{background:var(--ambar-suave);color:#f3c579}
  .vacio{color:var(--gris);text-align:center;padding:40px 10px}
  .burbujas{display:flex;flex-direction:column;gap:10px}
  .tu,.el{max-width:88%;padding:10px 13px;border-radius:14px;font-size:14px;line-height:1.45;
          white-space:pre-wrap}
  .tu{align-self:flex-end;background:#232329;border-bottom-right-radius:5px}
  .el{align-self:flex-start;background:var(--carbon);border:1px solid var(--linea);
      border-bottom-left-radius:5px}
  .coste{align-self:flex-start;color:#6f6f78;font-size:10.5px;margin:-6px 0 2px}
  .escribir{display:flex;gap:8px;align-items:center;border-top:1px solid var(--linea);
            padding:10px 12px;background:var(--negro)}
  .escribir input{flex:1;background:#0d0d10;border:1px solid var(--linea);border-radius:20px;
                  padding:11px 14px;color:var(--texto);font-size:16px}
  .enviar{width:36px;height:36px;border-radius:50%;background:var(--ambar);color:#221a08;
          border:0;font-size:17px;font-weight:700;flex:0 0 auto}
  .colas{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-bottom:18px}
  .cola{background:var(--carbon);border:1px solid var(--linea);border-radius:11px;
        padding:10px 11px;display:flex;gap:10px;align-items:center}
  .cola .n{font-size:22px;font-weight:600;color:var(--ambar);min-width:32px;text-align:right}
  .cola .q{font-size:12px;line-height:1.3}
  .cola .q span{color:var(--gris);font-size:11px}

  /* La caja de buscar, pensada para el pulgar y no para el raton:
     · font-size 16px OBLIGATORIO. Con menos, iOS hace ZOOM al enfocar y descoloca la pantalla
       entera. Estaba a 14px y era el fallo mas visible en el movil.
     · pegada arriba: al bajar por los resultados se perdia y habia que subir del todo para
       cambiar la busqueda.
     · con boton de borrar: en un teclado tactil, vaciar un campo a base de retroceso es un castigo. */
  .cajabuscar{position:sticky;top:0;z-index:4;background:var(--negro);
              padding:2px 0 12px;display:flex;gap:8px;align-items:center}
  .buscador{flex:1;background:var(--carbon);border:1px solid var(--linea);border-radius:12px;
            padding:13px 14px;color:var(--texto);font-size:16px;-webkit-appearance:none}
  .buscador:focus{outline:none;border-color:var(--ambar)}
  .limpiar{background:none;border:0;color:var(--gris);font-size:20px;width:40px;height:40px;
           flex:0 0 auto}
  /* Cada resultado es una zona TOCABLE de 44px minimo, no una linea de texto. */
  .doc{display:block;text-decoration:none;color:inherit;background:var(--carbon);
       border:1px solid var(--linea);border-left:3px solid var(--ambar);border-radius:11px;
       padding:12px 13px;margin-bottom:10px;min-height:44px}
  .doc:active{background:#1e1e24}
  .doc .t{font-weight:600;font-size:15px;line-height:1.3;margin-bottom:5px}
  .doc .s{color:var(--gris);font-size:13.5px;line-height:1.45}
  .doc .p{display:inline-block;font-size:11px;color:var(--ambar);background:var(--ambar-suave);
          border-radius:5px;padding:1px 6px;margin-bottom:6px}
  .sugerencias{display:flex;flex-wrap:wrap;gap:8px;margin-top:6px}
  .sug{background:var(--carbon);border:1px solid var(--linea);border-radius:18px;
       padding:9px 14px;font-size:13.5px;color:var(--texto)}
  .degradado{color:#f3c579;font-size:12.5px;margin-bottom:10px}

  .login{max-width:360px;margin:0 auto;padding:50px 4px}
  .login .marca{width:54px;height:54px;border-radius:14px;margin:0 auto 18px}
  .login .marca i::before,.login .marca i::after{left:10px;right:10px;height:8px}
  .login .marca i::before{top:10px} .login .marca i::after{bottom:10px}
  .login .marca s{left:10px;right:10px;top:23px;height:8px}
  .login .marca u{left:23px;top:20px;width:11px;height:11px}
  .login h1{text-align:center;margin:0 0 4px;font-size:21px}
  .login p{text-align:center;color:var(--gris);margin:0 0 24px;font-size:13px}
  .campo{width:100%;background:#0d0d10;border:1px solid var(--linea);border-radius:10px;
         padding:13px;color:var(--texto);font-size:16px;margin-bottom:11px}
  .grande{width:100%;justify-content:center;padding:13px}
  .error{color:#ffb3aa;font-size:13px;text-align:center;margin-top:12px;min-height:19px}
</style>
</head>
<body>

<!-- ENTRAR -->
<div id="pantalla-login" class="login">
  <div class="marca"><i></i><s></s><u></u></div>
  <h1>Zeno</h1>
  <p>Lo que espera tu OK, de los dos negocios</p>
  <div id="paso1">
    <input id="email" class="campo" type="email" placeholder="correo" autocomplete="username">
    <input id="pass" class="campo" type="password" placeholder="contraseña"
           autocomplete="current-password">
    <button id="btn-entrar" class="b primaria grande">Entrar</button>
  </div>
  <div id="paso2" hidden>
    <p style="margin-bottom:14px">Código de 6 cifras del mismo autenticador que el cockpit</p>
    <input id="codigo" class="campo" inputmode="numeric" autocomplete="one-time-code"
           placeholder="000000">
    <button id="btn-codigo" class="b primaria grande">Comprobar</button>
  </div>
  <div id="error-login" class="error"></div>
</div>

<!-- LA APLICACION -->
<div id="app" hidden style="display:flex;flex-direction:column;height:100%">
  <div class="barra">
    <div class="marca"><i></i><s></s><u></u></div>
    <div class="t" id="titulo">Zeno</div>
    <button class="salir" id="btn-salir">salir</button>
  </div>

  <main>
    <section id="v-pendientes"></section>
    <section id="v-chat" hidden>
      <div id="burbujas" class="burbujas"></div>
    </section>
    <section id="v-buscar" hidden>
      <div class="cajabuscar">
        <input id="q" class="buscador" type="search" enterkeyhint="search"
               autocomplete="off" autocapitalize="off" autocorrect="off"
               placeholder="busca en la documentación">
        <button id="limpiar" class="limpiar" hidden aria-label="borrar">✕</button>
      </div>
      <div id="resultados"></div>
    </section>
  </main>

  <div id="escribir" class="escribir" hidden>
    <input id="pregunta" placeholder="pregúntale lo que sea" autocomplete="off">
    <button id="enviar" class="enviar">↑</button>
  </div>

  <nav class="pie">
    <button data-vista="pendientes" class="on">Pendiente</button>
    <button data-vista="chat">Chat</button>
    <button data-vista="buscar">Buscar</button>
  </nav>
</div>

<script>
// La sesión es el token del cockpit. Se guarda en localStorage dentro de try/catch: en una ventana
// privada el acceso puede lanzar, y eso dejaría la aplicación en blanco sin decir por qué.
const LLAVE = "zeno.token";
const guarda = {
  leer(){ try { return localStorage.getItem(LLAVE) || ""; } catch { return ""; } },
  poner(v){ try { localStorage.setItem(LLAVE, v); } catch {} },
  tirar(){ try { localStorage.removeItem(LLAVE); } catch {} },
};
let token = guarda.leer();
let challenge = "";

async function api(ruta, opciones = {}) {
  const r = await fetch(ruta, {
    ...opciones,
    headers: { "Content-Type": "application/json",
               ...(token ? { Authorization: "Bearer " + token } : {}),
               ...(opciones.headers || {}) },
  });
  if (r.status === 401) { salir(); throw new Error("sesión caducada"); }
  const datos = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(datos.detail || ("error " + r.status));
  return datos;
}

const $ = (s) => document.querySelector(s);
const esc = (t) => String(t ?? "").replace(/[&<>"]/g, c =>
  ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

// ---------------------------------------------------------------- entrar
async function entrar() {
  $("#error-login").textContent = "";
  try {
    const r = await api("/api/login", { method: "POST", body: JSON.stringify({
      email: $("#email").value.trim(), password: $("#pass").value }) });
    if (r.twofa_required) { challenge = r.challenge; $("#paso1").hidden = true;
                            $("#paso2").hidden = false; $("#codigo").focus(); return; }
    dentro(r.token);
  } catch (e) { $("#error-login").textContent = e.message; }
}

async function comprobarCodigo() {
  $("#error-login").textContent = "";
  try {
    const r = await api("/api/login/2fa", { method: "POST", body: JSON.stringify({
      challenge, code: $("#codigo").value.trim() }) });
    dentro(r.token);
  } catch (e) { $("#error-login").textContent = e.message; }
}

function dentro(t) {
  token = t; guarda.poner(t);
  $("#pantalla-login").hidden = true; $("#app").hidden = false;
  ver("pendientes");
}

function salir() {
  if (token) fetch("/api/salir", { method: "POST",
                                   headers: { Authorization: "Bearer " + token } }).catch(() => {});
  token = ""; guarda.tirar();
  $("#app").hidden = true; $("#pantalla-login").hidden = false;
  $("#paso1").hidden = false; $("#paso2").hidden = true; $("#pass").value = "";
}

// ---------------------------------------------------------------- lo que espera tu OK
function pintaAccion(a) {
  // Lo que ABRE se pinta como ENLACE de verdad y es el botón grande: decisión del operador
  // (27-sep), lo irreversible no puede ser lo más fácil de pulsar con el pulgar.
  //
  // Antes todos eran <span>, o sea texto muerto: "ver preview no funciona", lo dijo la primera vez
  // que lo abrió. Ahora lo que se puede abrir se abre, y lo que ejecuta dice POR QUÉ no se pulsa
  // todavía en vez de fingir que es un botón.
  if (!a.op) return `<span class="b sin">${esc(a.etiqueta)} · sin contrato</span>`;
  const marcas = [];
  if (a.efecto === "publica") marcas.push('<span class="marca-accion m-mundo">sale al mundo</span>');
  if (a.coste_api) marcas.push('<span class="marca-accion m-cuesta">cuesta</span>');
  const texto = `${esc(a.etiqueta)} ${marcas.join(" ")}`;
  if (a.se_puede_abrir)
    return `<a class="b primaria" href="${esc(a.url)}" target="_blank" rel="noopener">${texto}</a>`;
  return `<span class="b sin" title="Ejecutar desde Zeno llega en la fase siguiente">${texto}</span>`;
}

function pintaColas(colas, total) {
  if (!colas.length) return "";
  let h = `<div class="resumen">Todo lo pendiente: <b>${total}</b></div><div class="colas">`;
  for (const c of colas)
    h += `<div class="cola"><div class="n">${c.cuantos}</div>
            <div class="q">${esc(c.titulo)}<br><span>${esc(c.negocio)}</span></div></div>`;
  return h + "</div>";
}

async function cargaPendientes() {
  const c = $("#v-pendientes");
  c.innerHTML = '<div class="vacio">cargando…</div>';
  try {
    const d = await api("/api/pendientes");
    let html = "";
    // Los fallos van ARRIBA y siempre: una lista corta sin aviso se lee como "hay poco pendiente".
    for (const f of d.fallos || []) html += `<div class="aviso-fallo">No se ha podido leer ${esc(f)}</div>`;
    // El recuento COMPLETO va arriba del todo: el feed de abajo da lo que toca hoy, y sin esto
    // parecía que solo había una cosa pendiente cuando había 113.
    html += pintaColas(d.colas || [], d.total_pendiente);
    const lista = d.pendientes || [];
    if (!lista.length) {
      html += '<div class="vacio">nada espera tu OK' +
              ((d.fallos || []).length ? "<br>(con lo que se ha podido leer)" : "") + "</div>";
    } else {
      const publican = lista.filter(p => p.publica_algo).length;
      const cuestan = lista.filter(p => p.cuesta_dinero).length;
      html += `<div class="resumen"><b>${lista.length}</b> ` +
              (lista.length === 1 ? "cosa espera" : "cosas esperan") + " tu OK · " +
              `${publican} pueden salir al mundo · ${cuestan} gastan API</div>`;
      for (const p of lista) {
        html += `<div class="tarjeta">
          <div class="neg ${p.negocio === "GutLyn" ? "gutlyn" : ""}">${esc(p.negocio)}</div>
          <div class="post">${esc(p.titulo)}</div>
          ${p.cuerpo ? `<div class="extracto">${esc(p.cuerpo.slice(0, 260))}</div>` : ""}
          <div class="btns">${(p.acciones || []).map(pintaAccion).join("")}</div>
        </div>`;
      }
    }
    c.innerHTML = html;
  } catch (e) { c.innerHTML = `<div class="aviso-fallo">${esc(e.message)}</div>`; }
}

// ---------------------------------------------------------------- buscar
let tecleando;

// Una pantalla en blanco con una caja no dice que se puede preguntar. Estas cuatro salen de lo que
// el corpus responde bien, comprobado contra produccion.
const EJEMPLOS = ["fórmula de precios", "tope diario de arcos", "cadencia de Claire",
                  "guardas de gasto de API"];
function sugerencias() {
  return `<div class="resumen">Prueba con</div><div class="sugerencias">` +
    EJEMPLOS.map(e => `<button class="sug" data-q="${esc(e)}">${esc(e)}</button>`).join("") +
    `</div>`;
}
async function busca() {
  const q = $("#q").value.trim();
  const c = $("#resultados");
  $("#limpiar").hidden = !q;
  if (q.length < 2) { c.innerHTML = sugerencias(); return; }
  try {
    const d = await api("/api/buscar?q=" + encodeURIComponent(q));
    let html = "";
    if (d.modo === "texto")
      html += '<div class="degradado">Buscando solo por texto: el servicio de significado no responde</div>';
    if (d.modo === "no disponible")
      html += '<div class="aviso-fallo">El corpus no está disponible ahora mismo</div>';
    const res = d.resultados || [];
    if (!res.length) {
      html += `<div class="vacio">nada en la documentación sobre eso</div>`;
    } else {
      html += `<div class="resumen">${res.length} documento${res.length === 1 ? "" : "s"}</div>`;
      for (const r of res) {
        // El fragmento que RESPONDE va entero, no cortado a una linea: leerlo es lo que evita
        // abrir el documento para nada, y en el movil hay sitio de sobra a lo alto.
        const trozo = r.trozo || (r.sub || "").replace(/^\d+%\s*·\s*/, "");
        const puntos = r.puntos ?? parseInt((r.sub || "").match(/^(\d+)%/)?.[1] ?? "", 10);
        html += `<a class="doc" href="https://cockpit.zenvrax.com/conocimiento" target="_blank"
                    rel="noopener">
          ${Number.isFinite(puntos) ? `<div class="p">${puntos}% de coincidencia</div>` : ""}
          <div class="t">${esc(r.title || r.id || "?")}</div>
          ${trozo ? `<div class="s">${esc(trozo)}</div>` : ""}
        </a>`;
      }
    }
    c.innerHTML = html;
  } catch (e) { c.innerHTML = `<div class="aviso-fallo">${esc(e.message)}</div>`; }
}

// ---------------------------------------------------------------- chat (apagado)
function burbuja(clase, texto) {
  const d = document.createElement("div");
  d.className = clase; d.textContent = texto;
  $("#burbujas").appendChild(d);
  d.scrollIntoView({ block: "end" });
  return d;
}

async function preguntar() {
  const caja = $("#pregunta");
  const texto = caja.value.trim();
  if (texto.length < 2) return;
  caja.value = "";
  burbuja("tu", texto);
  const esperando = burbuja("el", "pensando…");
  try {
    const r = await api("/api/chat", { method: "POST", body: JSON.stringify({ texto }) });
    esperando.textContent = r.respuesta || "(sin respuesta)";
    // El coste va DEBAJO de cada respuesta, no escondido en un ajuste: es la unica pieza de Zeno
    // cuyo gasto lo decide el uso, y verlo es lo que evita la sorpresa a fin de mes.
    const c = document.createElement("div");
    c.className = "coste";
    c.textContent = `$${(r.coste_usd ?? 0).toFixed(4)} · ${r.modelo} · ` +
                    `${r.preguntas_hoy}/${r.tope_diario} preguntas hoy`;
    $("#burbujas").appendChild(c);
    c.scrollIntoView({ block: "end" });
  } catch (e) {
    esperando.textContent = e.message;
  }
}

function cargaChat() {
  if (!$("#burbujas").children.length)
    burbuja("el", "Pregúntame por lo que tienes pendiente, cómo van los negocios o qué dice la " +
                  "documentación. Todavía no puedo ejecutar nada: te digo dónde está el botón.");
}

// ---------------------------------------------------------------- navegar
const TITULOS = { pendientes: "Zeno", chat: "Chat", buscar: "Buscar" };
function ver(vista) {
  for (const v of ["pendientes", "chat", "buscar"]) $("#v-" + v).hidden = v !== vista;
  document.querySelectorAll(".pie button").forEach(b =>
    b.classList.toggle("on", b.dataset.vista === vista));
  $("#titulo").textContent = TITULOS[vista];
  if (vista === "pendientes") cargaPendientes();
  if (vista === "chat") { cargaChat(); $("#pregunta").focus(); }
  if (vista === "buscar") {
    if (!$("#resultados").innerHTML) $("#resultados").innerHTML = sugerencias();
    $("#q").focus();
  }
  $("#escribir").hidden = vista !== "chat";
}

$("#btn-entrar").onclick = entrar;
$("#btn-codigo").onclick = comprobarCodigo;
$("#btn-salir").onclick = salir;
$("#pass").onkeydown = (e) => { if (e.key === "Enter") entrar(); };
$("#codigo").onkeydown = (e) => { if (e.key === "Enter") comprobarCodigo(); };
$("#enviar").onclick = preguntar;
$("#pregunta").onkeydown = (e) => { if (e.key === "Enter") preguntar(); };
$("#q").oninput = () => { clearTimeout(tecleando); tecleando = setTimeout(busca, 350); };
$("#limpiar").onclick = () => { $("#q").value = ""; $("#q").focus(); busca(); };
// Las sugerencias se atienden por delegacion: se pintan despues, asi que no existen todavia cuando
// se registran los manejadores.
$("#resultados").onclick = (e) => {
  const s = e.target.closest(".sug");
  if (!s) return;
  $("#q").value = s.dataset.q;
  busca();
};
document.querySelectorAll(".pie button").forEach(b => b.onclick = () => ver(b.dataset.vista));

// Si ya había sesión, se entra directo. Si el token ya no vale, `api` hace salir() solo.
if (token) { $("#pantalla-login").hidden = true; $("#app").hidden = false; ver("pendientes"); }
</script>
</body>
</html>
