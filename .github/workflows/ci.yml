name: CI Zeno

# QUE SE VALIDA AQUI, Y QUE NO.
#
# Los tests de Zeno son casi todos puros: no tocan red ni base, asi que corren enteros en CI. La
# excepcion es el CATALOGO de acciones, que se RECOLECTA leyendo el codigo del cockpit y de Xrise,
# y esos son otros dos repos privados. Aqui no estan.
#
# Por eso `sistemas_ausentes()` existe: cuando un repo no esta, sus tests se OMITEN en vez de
# fallar. Un guardian que se pone rojo porque falta un repo hermano acaba desactivado, y entonces
# ya no guarda nada.
#
# LO QUE ESTO NO PUEDE VER, dicho claro: que alguien añada un boton en el cockpit y desincronice
# el catalogo. Eso se valida corriendo los tests en local, donde los tres repos estan al lado. Al
# graduar Zeno a su repo (28-sep) se perdio esa red, y no se disimula con un CI que parezca
# comprobarlo.

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pruebas:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Dependencias
        run: pip install -r requirements.txt pytest
      - name: Pruebas
        run: python -m pytest tests/ -q
